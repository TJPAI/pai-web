name: Migrate support typography batch 3
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate_support_typography_batch3.py'
      - '.github/workflows/migrate-support-typography-batch3.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python tools/migrate_support_typography_batch3.py
      - name: Validate site
        run: python tools/validate.py
      - name: Commit migration and self-clean
        run: |
          rm tools/migrate_support_typography_batch3.py .github/workflows/migrate-support-typography-batch3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css assets/css/refine-base.css tools/migrate_support_typography_batch3.py .github/workflows/migrate-support-typography-batch3.yml
          git commit -m 'refactor: route remaining support text through typography token'
          git push
