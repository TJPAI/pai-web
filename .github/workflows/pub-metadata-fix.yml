name: One-time 2025 DOI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply verified DOI corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/publications.json')
          items=json.loads(p.read_text(encoding='utf-8'))
          fixes={
            'Reconfigurable Intelligent Surface-Assisted Localization in OFDM Systems With Carrier Frequency Offset and Phase Noise':'10.1109/TWC.2025.3557935',
            'Dual-Segment Clustering Strategy for Hierarchical Federated Learning in Heterogeneous Wireless Environments':'10.1109/LWC.2025.3556462',
            'Reinforcement Learning Based Online Algorithm for Near-Field Time-Varying IRS Phase Shift Optimization: System Evolution Perspective':'10.1109/TSP.2025.3545164'
          }
          seen=set()
          for item in items:
              title=item.get('title')
              if title in fixes:
                  item['doi']=fixes[title]
                  seen.add(title)
          missing=set(fixes)-seen
          if missing: raise SystemExit(f'Missing titles: {sorted(missing)}')
          titles=[x['title'].casefold() for x in items]
          dois=[x['doi'].casefold() for x in items if x.get('doi')]
          if len(titles)!=len(set(titles)): raise SystemExit('duplicate title')
          if len(dois)!=len(set(dois)): raise SystemExit('duplicate DOI')
          p.write_text(json.dumps(items,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "content: add verified remaining 2025 DOIs"
          git push
