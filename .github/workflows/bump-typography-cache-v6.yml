name: Bump typography cache v6
on:
  push:
    branches: [main]
    paths:
      - 'tools/bump_typography_cache_v6.py'
      - '.github/workflows/bump-typography-cache-v6.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply cache bump
        run: python tools/bump_typography_cache_v6.py
      - name: Validate site
        run: python tools/validate.py
      - name: Commit cache bump and self-clean
        run: |
          rm tools/bump_typography_cache_v6.py .github/workflows/bump-typography-cache-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' en people assets/css/refine.css tools/bump_typography_cache_v6.py .github/workflows/bump-typography-cache-v6.yml
          git commit -m 'chore: publish final typography cache version'
          git push
