name: Fix share image v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode corrected share image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          parts=[Path(f'tmp/share-q50-{i:02d}.b64').read_text() for i in range(7)]
          raw=base64.b64decode(''.join(parts), validate=False)
          Path('assets/images/social/pai-share-v4.jpg').write_bytes(raw)
          print('decoded bytes:', len(raw))
          assert len(raw)==36626, len(raw)
          assert raw[:2]==b'\xff\xd8' and raw[-2:]==b'\xff\xd9'
          PY
          file assets/images/social/pai-share-v4.jpg
      - name: Validate site
        run: |
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
      - name: Commit corrected image
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/images/social/pai-share-v4.jpg
          git diff --cached --quiet || git commit -m "fix: restore correct PAI share image v4"
          git push
