name: One-time orbit asset refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset versions and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'assets/css/refine\.css\?v=[^"]+', 'assets/css/refine.css?v=20260920-12', s)
              s=re.sub(r'assets/js/site\.js\?v=[^"]+', 'assets/js/site.js?v=20260920-49', s)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html'
          git diff --cached --quiet || git commit -m 'chore: refresh orbit navigation assets'
          git rm .github/workflows/orbit-refresh.yml
          git commit -m 'chore: remove one-time orbit refresh workflow'
          git push
