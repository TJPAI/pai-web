name: Fix persistent header v39
on:
  push:
    paths:
      - 'tools/fix-persistent-header-v39.py'
      - '.github/workflows/fix-persistent-header-v39.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/fix-persistent-header-v39.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/fix-persistent-header-v39.py .github/workflows/fix-persistent-header-v39.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep mobile header persistent across page transitions"
          git push
