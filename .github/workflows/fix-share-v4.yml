name: Fix share image v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode corrected share image
        run: |
          cat tmp/share-q50-00.b64 tmp/share-q50-01.b64 tmp/share-q50-02.b64 tmp/share-q50-03.b64 tmp/share-q50-04.b64 tmp/share-q50-05.b64 tmp/share-q50-06.b64 | base64 -d > assets/images/social/pai-share-v4.jpg
          file assets/images/social/pai-share-v4.jpg
          test "$(wc -c < assets/images/social/pai-share-v4.jpg)" -eq 36626
      - name: Validate site
        run: |
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
      - name: Commit corrected image
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/images/social/pai-share-v4.jpg
          git diff --cached --quiet || git commit -m "fix: restore correct PAI share image v4"
          git push
