name: Fix results news title class once

on:
  push:
    branches:
      - fix/results-news-title-class

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix results news title semantic class'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/results-news-title-class
          fetch-depth: 0
      - name: Apply semantic title class
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('publications.html'): ('<h2 id="latest-news-title">最新动态</h2>', '<h2 id="latest-news-title" class="title-minor">最新动态</h2>'),
              Path('en/publications.html'): ('<h2 id="latest-news-title">Latest News</h2>', '<h2 id="latest-news-title" class="title-minor">Latest News</h2>'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one title anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/validate.py
          rm .github/workflows/results-title-fix-once.yml
          python tools/validate_repository_hygiene.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html .github/workflows/results-title-fix-once.yml
          git commit -m "Fix results news title semantic class"
          git push origin HEAD:fix/results-news-title-class
