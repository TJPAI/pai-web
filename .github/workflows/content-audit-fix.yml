name: Apply verified profile wording fix

on:
  push:
    paths:
      - '.github/workflows/content-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified wording
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
              'people/erwu-liu.html': (
                  '出版 Cambridge University Press 专著《Magnetic Communications》',
                  '合著 Cambridge University Press 专著《Magnetic Communications: Theory and Techniques》'
              ),
              'en/people/erwu-liu.html': (
                  'Author of <em>Magnetic Communications</em>, published by Cambridge University Press',
                  'Co-author of <em>Magnetic Communications: Theory and Techniques</em>, published by Cambridge University Press'
              ),
          }
          for name, (old, new) in changes.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one source phrase, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/content-audit-fix.yml
      - name: Commit verified content fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add people/erwu-liu.html en/people/erwu-liu.html .github/workflows/content-audit-fix.yml
          git commit -m 'content: use verified full monograph authorship wording'
          git push origin HEAD:main
