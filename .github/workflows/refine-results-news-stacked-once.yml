name: Refine results news stacked once

on:
  push:
    branches:
      - refine/results-news-stacked

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Stack latest news below results intro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/results-news-stacked
          fetch-depth: 0
      - name: Apply stacked news layout
        run: python tools/refine_results_news_stacked_once.py
      - name: Remove temporary files and validate
        run: |
          rm tools/refine_results_news_stacked_once.py
          rm .github/workflows/refine-results-news-stacked-once.yml
          python tools/validate_repository_hygiene.py
          python tools/validate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stack latest news below results intro"
          git push origin HEAD:refine/results-news-stacked
