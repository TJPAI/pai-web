name: Fix swipe navigation cache

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_swipe_cache.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply swipe cache repair
        run: python tools/fix_swipe_cache.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/fix_swipe_cache.py .github/workflows/fix-swipe-cache.yml
          git add assets/js/site.js '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html' || true
          git commit -m "fix: make mobile swipe navigation load reliably"
          git push
