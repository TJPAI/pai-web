name: Check homepage image sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-home-image-sources.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow numpy
      - name: Compare source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pai-src
          curl -fL --retry 3 'https://news.tongji.edu.cn/_mediafile/tjnews/photos/images/2014/4/25/650/bdj4sjswou5jxkd.jpg' -o /tmp/pai-src/mine
          curl -fL --retry 3 'https://see.tongji.edu.cn/__local/9/93/3D/0B427C67959BBF2EB570EC25939_B112E241_781C3.png?e=.png' -o /tmp/pai-src/microsoft
          curl -fL --retry 3 'https://news.tongji.edu.cn/__local/5/09/7C/9DF69DAA2AE2F9F656D71BAD4C7_46EED02F_A6634.png' -o /tmp/pai-src/ieee
          python - <<'PY'
          from PIL import Image
          import numpy as np
          for name in ('mine','microsoft','ieee'):
              im=Image.open('/tmp/pai-src/'+name)
              g=im.convert('L')
              a=np.array(g.resize((16,16),Image.Resampling.LANCZOS))
              bits=(a>a.mean()).flatten()
              ah=''.join(f'{int("".join("1" if x else "0" for x in bits[i:i+4]),2):x}' for i in range(0,len(bits),4))
              a=np.array(g.resize((17,16),Image.Resampling.LANCZOS))
              bits=(a[:,1:]>a[:,:-1]).flatten()
              dh=''.join(f'{int("".join("1" if x else "0" for x in bits[i:i+4]),2):x}' for i in range(0,len(bits),4))
              print(name, im.size, 'ah', ah, 'dh', dh)
          PY
