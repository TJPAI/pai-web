name: Clean orbit rebuild
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild orbit from pre-orbit baseline
        run: python tools/rebuild_orbit_clean.py
      - name: Validate
        run: |
          node --check assets/js/site.js
          python tools/validate.py
          python tools/validate_share_metadata.py
      - name: Commit rebuilt orbit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "feat: rebuild orbit navigation from stable baseline"
          git push
