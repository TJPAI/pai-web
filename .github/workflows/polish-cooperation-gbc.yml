name: One-off cooperation and GBC polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/polish-cooperation-gbc.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bilingual GBC links and enlarge cooperation titles
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'about.html': (
                  '<div class="detail-block"><h3>IEEE Global Blockchain Conference</h3><p>建设国际区块链学术交流与产业合作平台。</p></div>',
                  '<div class="detail-block"><h3><a class="impact-link" href="https://www.ieee-gbc.org.cn" target="_blank" rel="noopener noreferrer">IEEE Global Blockchain Conference</a></h3><p>建设国际区块链学术交流与产业合作平台。</p></div>'
              ),
              'en/about.html': (
                  '<div class="detail-block"><h3>IEEE Global Blockchain Conference</h3><p>International conference platform for blockchain research and applications.</p></div>',
                  '<div class="detail-block"><h3><a class="impact-link" href="https://www.ieee-gbc.org" target="_blank" rel="noopener noreferrer">IEEE Global Blockchain Conference</a></h3><p>International conference platform for blockchain research and applications.</p></div>'
              ),
          }

          for rel, (old, new) in replacements.items():
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'target not found in {rel}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          css = Path('assets/css/app-core.css')
          s = css.read_text(encoding='utf-8')
          block = '''\n/* Cooperation card title hierarchy */\n#collaboration .partner h3{font-size:18px;line-height:1.4;font-weight:650;letter-spacing:-.01em}\n@media(max-width:768px){#collaboration .partner h3{font-size:21px;line-height:1.38}}\n'''
          if '/* Cooperation card title hierarchy */' not in s:
              css.write_text(s.rstrip() + '\n' + block, encoding='utf-8')
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused change and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/polish-cooperation-gbc.yml
          git add about.html en/about.html assets/css/app-core.css .github/workflows/polish-cooperation-gbc.yml
          git commit -m 'style: strengthen cooperation titles and link GBC sites'
          git push
