name: Finalize homepage logo animation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-home-logo.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified MP4 and wire homepage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp/home-logo-complete-upload:refs/remotes/origin/tmp/home-logo-complete-upload
          mkdir -p assets/media assets/css assets/js

          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess

          ref='origin/tmp/home-logo-complete-upload'
          def show(path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True).strip()
          def git_blob_sha(text):
              b=text.encode('ascii')
              return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()

          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          seg0=show('tmp/final-logo-00.b64')
          seg1=show('tmp/final-logo-01.b64')
          broken2=show('tmp/final-logo-02.b64')
          seg3=show('tmp/final-logo-03.b64')
          seg4=show('tmp/final-logo-04.b64')
          broken5=show('tmp/final-logo-05.b64')
          seg6=show('tmp/final-logo-06.b64')

          # Segment 02 is exactly one character short. Locate the affected 2 KB
          # source slice and brute-force one insertion until its immutable blob SHA matches.
          expected2=[
              '70a461fa12121aee524aef9b5927c76ed4f53825','7e356fd7fd0492eed1611b59e878e1c6f8db5d60',
              'a7eb42ef7f3932498a915f84f573ecb1258acac4','b9d06fa30f15f5ee982f63f743b6df5dea303616',
              '8ca929c76c3800ee9c67e88c8820c4068cb0a2ab','da1561c27866d4e293bcc3cc0f4787886216e9b7',
              '1231f6398dd2064d90fab5d7777179bc29287ec2','8d94dadb2be8a380d20131b7e57f830ec35500a8',
          ]
          if len(broken2)!=15999: raise SystemExit(f'unexpected segment02 length {len(broken2)}')
          bad=None
          for i,sha in enumerate(expected2):
              s=i*2000
              if len(broken2)>=s+2000 and git_blob_sha(broken2[s:s+2000])==sha: continue
              bad=i; break
          if bad is None: raise SystemExit('segment02 missing position not found')
          s=bad*2000
          prefix,damaged,suffix=broken2[:s],broken2[s:s+1999],broken2[s+1999:]
          repaired=None
          for pos in range(2000):
              for ch in alphabet:
                  cand=damaged[:pos]+ch+damaged[pos:]
                  if git_blob_sha(cand)==expected2[bad]: repaired=cand; break
              if repaired is not None: break
          if repaired is None: raise SystemExit('segment02 repair failed')
          seg2=prefix+repaired+suffix
          if len(seg2)!=16000 or git_blob_sha(seg2)!='828ca1d98674a876b23fd152e0e25a465c93b8d4':
              raise SystemExit('segment02 full verification failed')

          # Segment 05 has the correct length but a copied character may have changed.
          # Repair each mismatching 2 KB slice with at most one base64-character substitution.
          expected5=[
              'fd175830a26d551bab041addc32b49d6735dbccc','6fd1d097a4546a39965f96636b1454d47f56d8a3',
              'ee5b0033283b9284b70f27522601d9028f469a69','118d4ebb0a4dbc8824e775fc6833f8c25de67071',
              'ab03f9ae03408204932b9905febdc9f1016668b1','399c681ba959e74312b9094619aa33a56a7fa032',
              'fa999d72e69861d64528f665183b093ef00979b6','e03189245a2731acae07cee0f07c5c9808860c95',
          ]
          if len(broken5)!=16000: raise SystemExit(f'unexpected segment05 length {len(broken5)}')
          chunks=[]
          for i,target in enumerate(expected5):
              chunk=broken5[i*2000:(i+1)*2000]
              if git_blob_sha(chunk)==target:
                  chunks.append(chunk); continue
              fixed=None
              for pos,old in enumerate(chunk):
                  for ch in alphabet:
                      if ch==old: continue
                      cand=chunk[:pos]+ch+chunk[pos+1:]
                      if git_blob_sha(cand)==target:
                          fixed=cand; break
                  if fixed is not None: break
              if fixed is None:
                  raise SystemExit(f'segment05 chunk {i} needs more than one substitution')
              print(f'repaired segment05 chunk {i}')
              chunks.append(fixed)
          seg5=''.join(chunks)
          if git_blob_sha(seg5)!='745d87d593bccbb0fdbb78658c16cabe6bf91f84':
              raise SystemExit('segment05 full verification failed')

          encoded=seg0+seg1+seg2+seg3+seg4+seg5+seg6
          data=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          if digest!='4a6686f46ce83314dd65a7a6caa7e32f7d4d77dd07447dfb7789cb0e68589707':
              raise SystemExit(f'final MP4 SHA256 mismatch: {digest}')
          if len(data)!=68343 or b'ftyp' not in data[:64] or b'moov' not in data[:4096] or b'mdat' not in data:
              raise SystemExit('final MP4 structural verification failed')
          Path('assets/media/pai-logo-motion.mp4').write_bytes(data)
          print(f'Verified homepage MP4: {len(data)} bytes sha256={digest}')
          PY

          cat > assets/css/home-logo.css <<'CSS'
          /* Homepage PAI logo motion; isolated from stable navigation/page-swipe CSS. */
          .home-hero .hero-art.pai-logo-motion-host{display:flex;align-items:center;justify-content:center}
          .home-hero .pai-logo-motion{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent}
          @media(max-width:768px){.home-hero .hero-art.pai-logo-motion-host{opacity:.72}}
          CSS

          cat > assets/js/home-logo.js <<'JS'
          (function(){
            'use strict';
            const normalizedPath=()=>{
              let path=location.pathname||'/';
              if(location.hostname==='tjpai.github.io'&&path.startsWith('/pai-web')) path=path.slice('/pai-web'.length)||'/';
              return path;
            };
            const isHome=()=>['/','/index.html','/en/','/en/index.html'].includes(normalizedPath());
            const mediaUrl=()=>{
              const prefix=location.hostname==='tjpai.github.io'?'/pai-web':'';
              return `${prefix}/assets/media/pai-logo-motion.mp4?v=20260920-01`;
            };
            let scheduled=false;
            const init=()=>{
              scheduled=false;
              if(!isHome()) return;
              const host=document.querySelector('.home-hero .hero-art');
              if(!host||host.dataset.paiLogoMotion==='1') return;
              host.dataset.paiLogoMotion='1';
              host.classList.add('pai-logo-motion-host');
              const video=document.createElement('video');
              video.className='pai-logo-motion';
              video.muted=true; video.defaultMuted=true; video.playsInline=true;
              video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
              video.preload='auto'; video.setAttribute('aria-hidden','true'); video.src=mediaUrl();
              const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
              if(reduced){
                video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.max(0,(video.duration||5)-0.04);}catch(_e){}},{once:true});
                video.addEventListener('seeked',()=>{host.replaceChildren(video);},{once:true});
              }else{
                video.autoplay=true;
                video.addEventListener('canplay',()=>{host.replaceChildren(video);video.play().catch(()=>{});},{once:true});
              }
            };
            const schedule=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(init);};
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true}); else schedule();
            new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
            addEventListener('popstate',schedule);
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          targets=[
              (Path('index.html'),'assets/css/home-logo.css?v=20260920-01','assets/js/home-logo.js?v=20260920-01'),
              (Path('en/index.html'),'../assets/css/home-logo.css?v=20260920-01','../assets/js/home-logo.js?v=20260920-01'),
          ]
          for path,css,js in targets:
              text=path.read_text()
              if css not in text:
                  marker='<link rel="icon" type="image/svg+xml"'
                  if marker not in text: raise SystemExit(f'CSS insertion marker missing in {path}')
                  text=text.replace(marker,f'<link rel="stylesheet" href="{css}">'+marker,1)
              if js not in text:
                  if '</body>' not in text: raise SystemExit(f'JS insertion marker missing in {path}')
                  text=text.replace('</body>',f'<script src="{js}"></script></body>',1)
              path.write_text(text)
          PY

          rm -rf tmp
          rm -f .github/workflows/finalize-home-logo.yml
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
          node --check assets/js/home-logo.js

      - name: Commit finalized homepage logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add homepage PAI logo animation'
          git push origin HEAD:main
          git push origin --delete tmp/home-logo-complete-upload || true
