name: Build Boda full temporary
on:
  push:
    branches: [build/boda-full-2026-10-07]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full Boda package
        run: python tools/package_boda.py --output pai-web-boda-2026-10-07-full.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda-2026-10-07-full
          path: pai-web-boda-2026-10-07-full.zip
          if-no-files-found: error
          retention-days: 7
