name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shared head template
        run: python tools/sync_shared_head.py --check
      - name: Validate site content
        run: python tools/validate.py
      - name: Prepare Safari-safe homepage images
        run: python tools/prepare_home_assets.py
      - name: Validate homepage assets
        run: python tools/validate_home_assets.py
      - name: Prepare Outputs navigation labels
        run: python tools/prepare_outputs_labels.py
      - name: Validate Outputs label
        run: python tools/validate_outputs_label.py
      - name: Validate share metadata
        run: python tools/validate_share_metadata.py
      - name: Validate site runtime syntax
        run: node --check assets/js/site.js && node --check sw.js && node --check assets/js/menu-exclusive.js
      - name: Inject mobile menu exclusivity helper
        run: python tools/inject_menu_exclusive.py
      - name: Normalize shared asset cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          refine_version = "20260925-04"
          site_js_version = "20260925-03"
          refine_pattern = re.compile(r"refine\.css\?v=[0-9-]+")
          site_js_pattern = re.compile(r"site\.js\?v=[0-9-]+")
          changed = 0
          for path in Path(".").rglob("*.html"):
              if "geosketch-mvp" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = refine_pattern.sub(f"refine.css?v={refine_version}", text)
              updated = site_js_pattern.sub(f"site.js?v={site_js_version}", updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1
          print(f"Normalized refine.css and site.js cache keys in {changed} HTML files")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
