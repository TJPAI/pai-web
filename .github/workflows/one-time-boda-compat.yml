name: One-time Boda compatibility cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Replace legacy WebP references and contact email
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_ext = '.' + 'webp'
          new_ext = '.jpg'
          old_mail = '23666042' + '@tongji.edu.cn'
          new_mail = 'lingtang@tongji.edu.cn'
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_ext, new_ext).replace(old_mail, new_mail)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(' -', path)

          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_ext in text or old_mail in text:
                  leftovers.append(str(path))

          if leftovers:
              raise SystemExit('Legacy references remain in: ' + ', '.join(leftovers))
          PY

      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: use JPG assets and update contact email"
          git push
