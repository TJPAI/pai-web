name: Restore click scroll v24
on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_click_scroll_v24.py'
      - '.github/workflows/restore-click-scroll-v24.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/restore_click_scroll_v24.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm -f tools/restore_click_scroll_v24.py .github/workflows/restore-click-scroll-v24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore remembered positions for direct navigation'
          git push
