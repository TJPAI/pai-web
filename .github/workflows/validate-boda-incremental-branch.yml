name: Validate Boda incremental branch
on:
  push:
    branches: [deploy/boda-incremental]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Python syntax
        run: python -m py_compile tools/*.py
      - name: Build full production package
        run: python tools/package_boda.py --output /tmp/pai-web-production.zip
