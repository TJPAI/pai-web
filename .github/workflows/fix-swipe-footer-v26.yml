name: Fix swipe footer v26
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_swipe_footer_v26.py'
      - '.github/workflows/fix-swipe-footer-v26.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Align patch with current v25 code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_swipe_footer_v26.py')
          s=p.read_text()
          s=s.replace("const targetScroll=Math.max(0,Number(preview.targetScroll)||0);","const targetScroll=rememberedPageScroll(normalizedPath(targetUrl.pathname));")
          p.write_text(s)
          PY
      - name: Apply patch
        run: python tools/fix_swipe_footer_v26.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/fix_swipe_footer_v26.py .github/workflows/fix-swipe-footer-v26.yml
          git add -A
          git commit -m 'fix: keep footer continuous during swipe navigation'
          git push origin main
