name: Cleanup swipe experiment v34
on:
  push:
    paths:
      - 'tools/cleanup_swipe_experiment_v34.py'
      - '.github/workflows/cleanup-swipe-v34.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply cleanup
        run: python tools/cleanup_swipe_experiment_v34.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/cleanup_swipe_experiment_v34.py .github/workflows/cleanup-swipe-v34.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove ineffective swipe direction experiment'
          git push
