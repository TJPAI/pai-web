name: Results news rhythm once

on:
  push:
    branches: [refine/results-news-first-item-rhythm]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refine/results-news-first-item-rhythm
      - name: Restore news background and normalize first result spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          if '  bottom:-74px;\n' not in s:
              raise SystemExit('Expected desktop background extension not found')
          s = s.replace('  bottom:-74px;\n', '  bottom:0;\n', 1)
          if '  .results-news::before{bottom:-56px}\n' not in s:
              raise SystemExit('Expected mobile background extension not found')
          s = s.replace('  .results-news::before{bottom:-56px}\n', '', 1)
          marker = '.page-results .page-hero>.container.std{display:block}\n'
          replacement = marker + '.page-results .page-hero{padding-bottom:0}\n'
          if replacement not in s:
              if marker not in s:
                  raise SystemExit('Results hero marker not found')
              s = s.replace(marker, replacement, 1)
          s = s.replace('  .page-results .page-hero{padding-bottom:56px}\n', '  .page-results .page-hero{padding-bottom:0}\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/results-news-rhythm-once.yml
      - name: Validate hygiene and diff
        run: |
          python tools/validate_repository_hygiene.py
          git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/refine.css .github/workflows/results-news-rhythm-once.yml
          git commit -m "Align first result spacing with result rows"
          git push origin HEAD:refine/results-news-first-item-rhythm
