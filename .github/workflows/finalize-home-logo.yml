name: Finalize homepage logo animation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-home-logo.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore final MP4 and wire homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/media
          python - <<'PY'
          from pathlib import Path
          import base64

          alphabet=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          text=''.join(Path(p).read_text() for p in [
              'tmp/logo-motion-00.b64','tmp/logo-motion-01.b64','tmp/logo-motion-02.b64'
          ])
          clean=''.join(ch for ch in text if ch in alphabet)
          if len(clean) % 4 == 1:
              clean=clean[:-1]
          clean += '=' * (-len(clean) % 4)
          data=base64.b64decode(clean, validate=False)

          def atoms(buf):
              out=[]
              pos=0
              total=len(buf)
              while pos+8 <= total:
                  size=int.from_bytes(buf[pos:pos+4],'big')
                  typ=buf[pos+4:pos+8].decode('latin1')
                  header=8
                  if size==1:
                      if pos+16>total: raise ValueError('truncated extended atom')
                      size=int.from_bytes(buf[pos+8:pos+16],'big')
                      header=16
                  elif size==0:
                      size=total-pos
                  if size<header or pos+size>total:
                      raise ValueError(f'invalid atom {typ!r} at {pos} size={size}')
                  out.append((typ,size))
                  pos+=size
              if pos != total:
                  raise ValueError(f'trailing bytes: {total-pos}')
              return out

          atom_list=atoms(data)
          types=[t for t,_ in atom_list]
          if len(data)<10000 or not types or types[0]!='ftyp' or 'moov' not in types or 'mdat' not in types:
              raise SystemExit(f'invalid reconstructed MP4 atoms: {atom_list}')
          p=Path('assets/media/pai-logo-motion.mp4')
          p.write_bytes(data)
          print(f'validated MP4: {len(data)} bytes; atoms={atom_list}')
          PY

          cat > assets/css/home-logo.css <<'CSS'
          /* Homepage PAI logo motion. Kept isolated from the stable site CSS. */
          .home-hero .hero-art.pai-logo-motion-host{display:flex;align-items:center;justify-content:center}
          .pai-logo-motion{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent}
          @media(max-width:768px){
            .home-hero .hero-art.pai-logo-motion-host{opacity:.72}
          }
          CSS

          cat > assets/js/home-logo.js <<'JS'
          (function(){
            'use strict';

            const normalizedPath=()=>{
              let path=location.pathname||'/';
              if(location.hostname==='tjpai.github.io'&&path.startsWith('/pai-web')) path=path.slice('/pai-web'.length)||'/';
              return path;
            };
            const isHome=()=>['/','/index.html','/en/','/en/index.html'].includes(normalizedPath());
            const mediaUrl=()=>{
              const prefix=location.hostname==='tjpai.github.io'?'/pai-web':'';
              return `${prefix}/assets/media/pai-logo-motion.mp4`;
            };

            let scheduled=false;
            const init=()=>{
              scheduled=false;
              if(!isHome()) return;
              const host=document.querySelector('.home-hero .hero-art');
              if(!host||host.dataset.paiLogoMotion==='1') return;
              host.dataset.paiLogoMotion='1';
              host.classList.add('pai-logo-motion-host');

              const video=document.createElement('video');
              video.className='pai-logo-motion';
              video.muted=true;
              video.defaultMuted=true;
              video.playsInline=true;
              video.setAttribute('playsinline','');
              video.setAttribute('webkit-playsinline','');
              video.preload='auto';
              video.setAttribute('aria-hidden','true');
              video.src=mediaUrl();

              const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
              if(reduced){
                video.autoplay=false;
                video.addEventListener('loadedmetadata',()=>{
                  try{ video.currentTime=Math.max(0,(video.duration||5)-0.06); }catch(_e){}
                },{once:true});
              }else{
                video.autoplay=true;
                video.addEventListener('canplay',()=>{ video.play().catch(()=>{}); },{once:true});
              }

              host.replaceChildren(video);
            };
            const schedule=()=>{
              if(scheduled) return;
              scheduled=true;
              requestAnimationFrame(init);
            };

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true});
            else schedule();
            new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
            addEventListener('popstate',schedule);
          })();
          JS

          python - <<'PY'
          from pathlib import Path

          targets=[
              (Path('index.html'),'assets/css/home-logo.css?v=20260920-01','assets/js/home-logo.js?v=20260920-01'),
              (Path('en/index.html'),'../assets/css/home-logo.css?v=20260920-01','../assets/js/home-logo.js?v=20260920-01'),
          ]
          for path,css,js in targets:
              text=path.read_text()
              if css not in text:
                  marker='<link rel="icon" type="image/svg+xml"'
                  text=text.replace(marker,f'<link rel="stylesheet" href="{css}">'+marker,1)
              if js not in text:
                  text=text.replace('</body>',f'<script src="{js}"></script></body>',1)
              path.write_text(text)
          PY

          rm -rf tmp
          rm -f .github/workflows/finalize-home-logo.yml

      - name: Commit finalized homepage logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add homepage PAI logo animation'
          git push origin HEAD:main
