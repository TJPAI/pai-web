name: Orbit spacing and close animation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/tune_orbit_english_spacing_close.py
      - name: Validate
        run: |
          node --check assets/js/site.js
          python tools/validate.py
          python tools/validate_share_metadata.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix: loosen English orbit spacing and slow close animation"
          git push
