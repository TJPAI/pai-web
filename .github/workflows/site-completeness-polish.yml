name: Site completeness polish

on:
  push:
    branches: [main]
    paths:
      - 'tools/site_completeness_polish.py'
      - '.github/workflows/site-completeness-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply site completeness polish
        run: python tools/site_completeness_polish.py
      - name: Validate site
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm -f tools/site_completeness_polish.py .github/workflows/site-completeness-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: complete bilingual site metadata and accessibility'
          git push
