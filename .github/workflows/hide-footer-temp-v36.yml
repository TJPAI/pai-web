name: Hide footer temp v36
on:
  push:
    paths:
      - 'tools/hide_footer_temp_v36.py'
      - '.github/workflows/hide-footer-temp-v36.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply temporary footer hide
        run: python tools/hide_footer_temp_v36.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/hide_footer_temp_v36.py .github/workflows/hide-footer-temp-v36.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: temporarily hide footer for swipe review'
          git push
