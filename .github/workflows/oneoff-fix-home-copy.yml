name: One-off homepage copy fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-home-copy.yml'

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Chinese homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '面向地下、煤矿等复杂环境的深穿透无线通信救援设备。'
          new = '面向地下、煤矿等环境的透地通信救援设备。'
          if old not in s:
              raise SystemExit('target copy not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/oneoff-fix-home-copy.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/oneoff-fix-home-copy.yml
          git commit -m "Copy: refine magnetic communication rescue description"
          git push origin HEAD:main
