name: Fix homepage research index weight once
on:
  push:
    branches: [fix/home-research-index-visual-size]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-research-index-visual-size
      - name: Match homepage research indices to code-label visual size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app-core.css')
          s=p.read_text()
          marker='/* About page links */'
          rule='/* Homepage research indices: same visual weight/size as PNL, IoT-NG and AIBI; muted color keeps hierarchy. */\n.page-home .research-identity>.research-index{font-weight:700}\n\n'
          assert marker in s
          assert rule not in s
          s=s.replace(marker,rule+marker,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/css/app-core.css
          git commit -m "Match homepage research index visual size"
          git push
