name: Package Boda site temp

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify manifest compatibility
        run: |
          test -f site.json
          test ! -f site.webmanifest
          if grep -R -n --include='*.html' --include='*.js' --include='*.py' 'site\.webmanifest' .; then
            echo 'Legacy site.webmanifest reference remains'
            exit 1
          fi
      - name: Build deployment CSS bundle
        run: python tools/prepare_css_bundle.py
      - name: Stamp deployed asset cache keys
        run: python tools/normalize_asset_versions.py
      - name: Stage public website
        run: python tools/prepare_public_artifact.py
      - name: Verify staged manifest
        run: |
          test -f _site/site.json
          test ! -f _site/site.webmanifest
      - name: Remove GitHub Pages-only CNAME
        run: rm -f _site/CNAME
      - name: Package website
        run: |
          cd _site
          zip -qr ../pai-web-boda.zip .
      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda
          path: pai-web-boda.zip
          if-no-files-found: error
          retention-days: 30
