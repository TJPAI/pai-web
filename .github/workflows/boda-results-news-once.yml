name: Build Boda Results News update once

on:
  push:
    branches: [build/boda-results-news-20261012]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: build/boda-results-news-20261012

      - name: Remove temporary workflow from branch
        run: |
          rm .github/workflows/boda-results-news-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/boda-results-news-once.yml
          git commit -m "Remove temporary Boda packaging workflow"
          git push

      - name: Build production Boda package
        run: python tools/package_boda.py --output /tmp/pai-web-production.zip

      - name: Create incremental Results News package
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          full = Path('/tmp/pai-web-production.zip')
          stage = Path('/tmp/boda-update')
          css = stage / 'assets/css/refine-bundle.css'
          css.parent.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(full) as z:
              css.write_bytes(z.read('assets/css/refine-bundle.css'))

          note = stage / 'UPDATE-FILES.txt'
          note.write_text(
              'PAI Web — Boda incremental update\n'
              'Source main: 463a611ac4334df90ec3cfb3c6316bb8cb05b9d0\n\n'
              'Overwrite this file on the Boda server:\n'
              '- assets/css/refine-bundle.css\n\n'
              'Do not delete any other server files.\n',
              encoding='utf-8'
          )

          out = Path('/tmp/pai-web-boda-results-news-update.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write(css, 'assets/css/refine-bundle.css')
              z.write(note, 'UPDATE-FILES.txt')
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert z.namelist() == ['assets/css/refine-bundle.css', 'UPDATE-FILES.txt']
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/SHA256.txt').write_text(f'{sha}  {out.name}\n', encoding='utf-8')
          print(sha)
          PY

      - name: Upload incremental package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pai-web-boda-results-news-update
          path: |
            /tmp/pai-web-boda-results-news-update.zip
            /tmp/SHA256.txt
          if-no-files-found: error
          retention-days: 7
