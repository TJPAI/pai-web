name: Polish results news once

on:
  push:
    branches:
      - refine/results-news-final-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Polish results news presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/results-news-final-polish
          fetch-depth: 0
      - run: python tools/polish_results_news_once.py
      - run: |
          rm tools/polish_results_news_once.py
          rm .github/workflows/polish-results-news-once.yml
          python tools/validate_repository_hygiene.py
          python tools/validate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html assets/css/refine.css tools/polish_results_news_once.py .github/workflows/polish-results-news-once.yml
          git commit -m "Polish results news presentation"
          git push origin HEAD:refine/results-news-final-polish
