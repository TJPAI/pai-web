name: One-time share image fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-share-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-cjk
      - name: Build clean square-safe JPEG share image and update metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT=assets/images/social/pai-share-v3.jpg
          SVG=/tmp/pai-share-v3.svg
          cat > "$SVG" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <rect width="1200" height="630" fill="#ffffff"/>
            <circle cx="-35" cy="-50" r="250" fill="#e8f3ff"/>
            <circle cx="-35" cy="-50" r="190" fill="#d8ebff" opacity=".72"/>
            <circle cx="1235" cy="680" r="250" fill="#e8f3ff"/>
            <circle cx="1235" cy="680" r="180" fill="#d8ebff" opacity=".72"/>
            <g fill="#111111">
              <path d="M355 165h150c64 0 106 37 106 91 0 56-42 94-106 94h-83v115h-67V300c0-36 22-56 60-56h91c23 0 38-11 38-30 0-18-15-29-38-29H355z"/>
              <path d="M585 465 702 165h54l118 300h-69l-76-210-77 210z"/>
              <rect x="895" y="165" width="67" height="300"/>
            </g>
            <path d="M694 409 748 268l31 49-43 112h-55z" fill="#ff7a00"/>
            <text x="600" y="535" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="58" font-weight="700" fill="#151515">同济大学 PAI 研究中心</text>
            <text x="600" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.3" fill="#6b7280">PAI Research Center · Tongji University</text>
          </svg>
          SVG
          convert "$SVG" -strip -colorspace sRGB -sampling-factor 4:2:0 -quality 90 "$OUT"
          identify "$OUT"
          python - <<'PY'
          from pathlib import Path
          old='https://tjpai.github.io/pai-web/assets/images/social/pai-share-v2.png'
          new='https://tjpai.github.io/pai-web/assets/images/social/pai-share-v3.jpg'
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old,new),encoding='utf-8')
          p=Path('tools/validate_share_metadata.py')
          text=p.read_text(encoding='utf-8')
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/social/pai-share-v3.jpg tools/validate_share_metadata.py '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html'
          git commit -m 'fix: use valid square-safe JPEG social preview'
          git push
