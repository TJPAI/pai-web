name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate tooling syntax
        run: python -m py_compile tools/*.py
      - name: Canonicalize homepage CTA links
        run: |
          python tools/validate_cta_links.py --write
          if ! git diff --quiet -- index.html en/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html en/index.html
            git commit -m "Align homepage CTA labels and destinations"
            git push
          fi
      - name: Validate shared head template
        run: python tools/sync_shared_head.py --check
      - name: Validate site content
        run: python tools/validate.py
      - name: Validate homepage assets
        run: python tools/validate_home_assets.py
      - name: Validate CTA links
        run: python tools/validate_cta_links.py
      - name: Validate Outputs label
        run: python tools/validate_outputs_label.py
      - name: Validate share metadata
        run: python tools/validate_share_metadata.py
      - name: Validate site runtime syntax
        run: node --check assets/js/site.js && node --check sw.js && node --check assets/js/menu-exclusive.js
      - name: Inject mobile menu exclusivity helper
        run: python tools/inject_menu_exclusive.py
      - name: Validate mobile menu exclusivity helper
        run: python tools/validate_menu_exclusive.py
      - name: Validate shared asset cache keys
        run: python tools/normalize_asset_versions.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
