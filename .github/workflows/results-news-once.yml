name: Apply results news once

on:
  push:
    branches: [feature/results-latest-news]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/results-latest-news
          fetch-depth: 0
      - run: python tools/apply_results_news_once.py
      - run: |
          rm .github/workflows/results-news-once.yml
          rm tools/apply_results_news_once.py
          python tools/validate_repository_hygiene.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html assets/css/refine.css .github/workflows/results-news-once.yml tools/apply_results_news_once.py
          git commit -m "Apply results latest-news layout"
          git push origin HEAD:feature/results-latest-news
