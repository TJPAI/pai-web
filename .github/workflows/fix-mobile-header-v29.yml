name: Fix mobile header v29
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_mobile_header_v29.py'
      - '.github/workflows/fix-mobile-header-v29.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/fix_mobile_header_v29.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/fix_mobile_header_v29.py .github/workflows/fix-mobile-header-v29.yml
          git add -A
          git commit -m 'fix: stabilize mobile header during swipe'
          git push origin main
