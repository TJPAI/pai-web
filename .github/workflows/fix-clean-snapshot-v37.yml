name: Fix clean page snapshots v37
on:
  push:
    paths:
      - 'tools/fix_clean_snapshot_v37.py'
      - '.github/workflows/fix-clean-snapshot-v37.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python tools/fix_clean_snapshot_v37.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/fix_clean_snapshot_v37.py .github/workflows/fix-clean-snapshot-v37.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep transient swipe transforms out of page cache'
          git push
