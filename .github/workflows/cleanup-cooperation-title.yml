name: One-off cleanup cooperation title styles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-cooperation-title.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate cooperation title styles
        shell: python
        run: |
          from pathlib import Path

          base=Path('assets/css/refine-base.css')
          s=base.read_text(encoding='utf-8')
          old='.partner h3{font-size:14px!important;color:var(--ink)!important;font-weight:620;margin-bottom:8px!important}'
          new='.partner h3{font-size:24px!important;line-height:1.34!important;color:var(--ink)!important;font-weight:650;margin-bottom:8px!important}'
          if old not in s:
            raise SystemExit('canonical mobile partner h3 rule not found')
          base.write_text(s.replace(old,new,1),encoding='utf-8')

          core=Path('assets/css/app-core.css')
          s=core.read_text(encoding='utf-8')
          block='''\n/* Cooperation card title hierarchy */\n#collaboration .partner h3{font-size:18px;line-height:1.4;font-weight:650;letter-spacing:-.01em}\n@media(max-width:768px){#collaboration .partner h3{font-size:24px!important;line-height:1.34;font-weight:650}}\n'''
          if block not in s:
            raise SystemExit('temporary cooperation override not found')
          core.write_text(s.replace(block,'\n',1),encoding='utf-8')
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/cleanup-cooperation-title.yml
          git add assets/css/refine-base.css assets/css/app-core.css .github/workflows/cleanup-cooperation-title.yml
          git commit -m 'refactor: consolidate cooperation title styles'
          git push
