name: Cleanup dead code once
on:
  push:
    branches: [cleanup/remove-dead-code-and-platform-divider]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-dead-code-and-platform-divider
      - name: Apply cleanup
        run: python tools/cleanup_dead_code_once.py
      - name: Remove one-off workflow locally
        run: rm .github/workflows/cleanup-dead-code-once.yml
      - name: Repair hygiene validator
        run: |
          cat > tools/validate_repository_hygiene.py <<'PY'
          #!/usr/bin/env python3
          """Reject temporary or retired repository artifacts before deployment."""
          from pathlib import Path
          ROOT = Path(__file__).resolve().parents[1]
          problems = []
          for path in ROOT.iterdir():
              if path.name.startswith('__'):
                  problems.append(f'temporary root artifact: {path.name}')
          workflow_dir = ROOT / '.github' / 'workflows'
          if workflow_dir.exists():
              for path in workflow_dir.glob('*-once.yml'):
                  problems.append(f'one-off workflow left in repository: {path.relative_to(ROOT)}')
          for rel in ('assets/js/home-logo.js', 'assets/css/home-logo.css'):
              if (ROOT / rel).exists():
                  problems.append(f'retired homepage-logo asset still present: {rel}')
          for html in ROOT.rglob('*.html'):
              if '_site' in html.parts:
                  continue
              text = html.read_text(encoding='utf-8', errors='ignore')
              if 'home-logo.js' in text or 'home-logo.css' in text:
                  problems.append(f'retired homepage-logo reference: {html.relative_to(ROOT)}')
          if problems:
              raise SystemExit('Repository hygiene failed:\n- ' + '\n- '.join(problems))
          print('Repository hygiene passed.')
          PY
      - name: Validate cleanup
        run: |
          python tools/validate_repository_hygiene.py
          python tools/sync_navigation_scripts.py --check
          python -m py_compile tools/*.py
          python tools/validate_environment_matrix.py
          python tools/check_production_readiness.py --preflight
          python tools/sync_shared_head.py --check
          python tools/render_publications.py
          python tools/validate.py
          python tools/validate_accessibility.py
          node --check assets/js/site.js
          node --check assets/js/anchor-navigation.js
          node --check sw.js
          python tools/package_boda.py --output /tmp/pai-web-production.zip
      - name: Commit non-workflow cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows
          git commit -m "Remove dead code and terminal platform divider"
          git push
