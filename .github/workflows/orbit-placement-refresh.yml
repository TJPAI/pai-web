name: One-time orbit placement refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'assets/css/refine\.css\?v=[^"]+', 'assets/css/refine.css?v=20260920-15', s)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: refresh orbit placement assets'
          git rm .github/workflows/orbit-placement-refresh.yml
          git commit -m 'chore: remove one-time orbit placement workflow'
          git push
