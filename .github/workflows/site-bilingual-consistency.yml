name: Site bilingual consistency
on:
  push:
    paths:
      - '.github/workflows/site-bilingual-consistency.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply consistency update
        run: python tools/site_bilingual_consistency.py
      - name: Validate site
        run: python tools/validate.py
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/site-bilingual-consistency.yml tools/site_bilingual_consistency.py
          git add '*.html' en people assets/css/refine.css
          git commit -m 'refactor: align bilingual content and site metadata'
          git push
