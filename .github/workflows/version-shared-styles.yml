name: One-off version shared styles
on:
  push:
    paths:
      - '.github/workflows/version-shared-styles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version shared stylesheet entry point
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pattern=re.compile(r'assets/css/refine\.css(?:\?v=[^"\']+)?')
          changed=0
          for p in root.rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              new=pattern.sub('assets/css/refine.css?v=20260919-4',text)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed+=1
          print(f'updated {changed} html files')
          PY
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
          node --check sw.js
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/version-shared-styles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: version canonical shared typography entry' || exit 0
          git push
