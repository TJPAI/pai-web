name: Revert two homepage SAGIN summaries

on:
  push:
    branches:
      - revert/remove-home-sagin-summaries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/remove-home-sagin-summaries
      - name: Remove two homepage summary lines in zh and en
        run: |
          python - <<'PY'
          from pathlib import Path
          reps={
            'index.html':[
              '<p class="section-summary">面向地下、低空与空天地一体等跨域复杂场景，贯通感知、连接与可信协同。</p>',
              '<p class="section-summary">面向低空与空天地协同场景，联合高校、科研机构与产业伙伴推进多平台感知、组网与智能协同验证。</p>',
            ],
            'en/index.html':[
              '<p class="section-summary">Across underground, low-altitude, and space–air–ground integrated environments, we connect sensing, communications, and trusted collaboration into a unified system capability.</p>',
              '<p class="section-summary">For low-altitude and space–air–ground collaborative scenarios, we work with universities, research institutes, and industry partners on multi-platform sensing, networking, and intelligent coordination.</p>',
            ],
          }
          for path,items in reps.items():
            p=Path(path); text=p.read_text(encoding='utf-8')
            for item in items:
              if text.count(item)!=1: raise SystemExit(f'{path}: expected one match')
              text=text.replace(item,'',1)
            p.write_text(text,encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/revert-two-home-sagin-lines.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove two homepage SAGIN summary lines"
          git push origin HEAD:revert/remove-home-sagin-summaries
