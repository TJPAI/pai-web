name: Results news fill bottom gap once

on:
  push:
    branches: [refine/results-news-fill-bottom-gap]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refine/results-news-fill-bottom-gap
      - name: Extend Latest News background through hero bottom padding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          old = '''.results-news::before{\n  content:\"\";\n  position:absolute;\n  z-index:-1;\n  top:0;\n  bottom:0;\n  left:50%;\n  width:100vw;\n  transform:translateX(-50%);\n  background:var(--soft);\n}\n'''
          new = '''.results-news::before{\n  content:\"\";\n  position:absolute;\n  z-index:-1;\n  top:0;\n  bottom:-74px;\n  left:50%;\n  width:100vw;\n  transform:translateX(-50%);\n  background:var(--soft);\n}\n'''
          if old not in s:
              raise SystemExit('Expected Latest News pseudo background block not found')
          s = s.replace(old, new, 1)
          marker = '  .results-news{margin-top:28px;padding:20px 0}\n'
          replacement = marker + '  .results-news::before{bottom:-56px}\n'
          if marker not in s:
              raise SystemExit('Expected mobile Latest News block not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/results-news-fill-bottom-gap-once.yml
      - name: Validate hygiene and diff
        run: |
          python tools/validate_repository_hygiene.py
          git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/refine.css .github/workflows/results-news-fill-bottom-gap-once.yml
          git commit -m "Extend latest-news background to divider"
          git push origin HEAD:refine/results-news-fill-bottom-gap
