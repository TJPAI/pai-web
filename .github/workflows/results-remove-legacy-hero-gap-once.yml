name: Results remove legacy hero gap once

on:
  push:
    branches: [refine/results-remove-legacy-hero-gap]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refine/results-remove-legacy-hero-gap
      - name: Remove legacy results hero bottom gap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          block = '''/* Research Results final rhythm: keep 01 comfortably separated from the intro, keep 05→06 continuous. */\n.page-results>.page-hero{padding-bottom:36px!important}\n@media(max-width:768px){\n  .page-results>.page-hero{padding-bottom:28px!important}\n}\n'''
          if block not in s:
              raise SystemExit('legacy results hero gap block not found')
          s = s.replace(block, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/results-remove-legacy-hero-gap-once.yml
      - name: Validate hygiene and diff
        run: |
          python tools/validate_repository_hygiene.py
          git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/refine.css .github/workflows/results-remove-legacy-hero-gap-once.yml
          git commit -m "Remove legacy results hero gap"
          git push origin HEAD:refine/results-remove-legacy-hero-gap
