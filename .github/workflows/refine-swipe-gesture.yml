name: Refine swipe gesture

on:
  push:
    branches: [main]
    paths:
      - 'tools/refine_swipe_gesture.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply swipe gesture refinement
        run: python tools/refine_swipe_gesture.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/refine_swipe_gesture.py .github/workflows/refine-swipe-gesture.yml
          git add assets/js/site.js '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html' || true
          git commit -m "refine: add native-feeling swipe gestures"
          git push
