name: Build Boda incremental artifact

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Previously deployed commit/tag/SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build incremental Boda package
        run: |
          python tools/package_boda_incremental.py \
            --base "${{ inputs.base_ref }}" \
            --output pai-web-boda-incremental.zip \
            --manifest pai-web-boda-incremental-files.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda-incremental
          path: |
            pai-web-boda-incremental.zip
            pai-web-boda-incremental-files.txt
          if-no-files-found: error
          retention-days: 30
