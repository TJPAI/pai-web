name: One-time publication archive metadata fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply verified 2022-2024 publication metadata corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          recent_path = Path('data/publications.json')
          archive_path = Path('data/publications-archive.json')
          recent = json.loads(recent_path.read_text(encoding='utf-8'))
          archive = json.loads(archive_path.read_text(encoding='utf-8'))

          move_title = 'Reconfigurable Intelligent Surface Empowered Federated Edge Learning with Statistical CSI'
          moved = None
          kept = []
          for item in archive:
              if item.get('title') == move_title:
                  moved = dict(item)
              else:
                  kept.append(item)
          if moved is None:
              raise SystemExit('Statistical CSI paper not found in archive')
          archive = kept
          moved.update({
              'year': 2024,
              'venue': 'IEEE Transactions on Wireless Communications, vol. 23, no. 6, pp. 6595-6608',
              'doi': '10.1109/TWC.2023.3334250'
          })
          if not any(x.get('title') == move_title for x in recent):
              recent.append(moved)

          fixes = {
            'ESKF-based Vehicle Positioning Through Cellular Signals, GNSS, IMU, and Odometer': {'doi':'10.1109/CAMA57522.2023.10352681'},
            'Cache-Aided MEC With the Assistance of Intelligent Reflecting Surface': {'doi':'10.1109/JIOT.2023.3270960'},
            'Visual Camouflage and Online Trajectory Planning for Unmanned Aerial Vehicle-Based Disguised Video Surveillance: Recent Advances and a Case Study': {'doi':'10.1109/MVT.2023.3263329'},
            'Deep Reinforcement Learning-Driven Reconfigurable Intelligent Surface-Assisted Radio Surveillance With a Fixed-Wing UAV': {'doi':'10.1109/TIFS.2023.3297021'},
            'Channel Access Optimization in Unlicensed Spectrum for Downlink URLLC: Centralized and Federated DRL Approaches': {'doi':'10.1109/JSAC.2023.3280982'},
            'Joint User, Channel, Modulation-Coding Selection, and RIS Configuration for Jamming Resistance in Multiuser OFDMA Systems': {'doi':'10.1109/TCOMM.2023.3238062'},
            'Joint Localization and Communication Study for Intelligent Reflecting Surface Aided Wireless Communication System': {'doi':'10.1109/TCOMM.2023.3249227'},
            'Machine Learning for 6G Enhanced Ultra-Reliable and Low-Latency Services': {'doi':'10.1109/MWC.006.2200407'},
            'Joint Active and Passive Beamforming Design for Reconfigurable Intelligent Surface Enabled Integrated Sensing and Communication': {'doi':'10.1109/TCOMM.2023.3244246'},
            'One Bit Aggregation for Federated Edge Learning with Reconfigurable Intelligent Surface: Analysis and Optimization': {'doi':'10.1109/TWC.2022.3198881'},
            'Water–Energy–Carbon Synergies and Trade-offs: A Daily Nexus Analysis for Wastewater Treatment Plants': {'doi':'10.1016/j.resconrec.2022.106712'},
            'Dynamic Offloading Strategy for Delay Sensitive Task in Mobile Edge Computing Networks': {'doi':'10.1109/JIOT.2022.3202797'},
            'Bayesian User Localization and Tracking for Reconfigurable Intelligent Surface Aided MIMO Systems': {'doi':'10.1109/JSTSP.2022.3173747'},
            'QoS-Driven Resource Optimization for Intelligent Fog Radio Access Network: A Dynamic Power Allocation Perspective': {'doi':'10.1109/TCCN.2021.3049209'},
            'Complex-valued Reinforcement Learning Based Dynamic Beamforming Design for IRS Aided Time-Varying Downlink Channel': {'doi':'10.1109/VTC2022-Spring54318.2022.9860446'},
            'Disguised Tailing and Video Surveillance with Solar-Powered Fixed-Wing Unmanned Aerial Vehicle': {'doi':'10.1109/TVT.2022.3157705'},
            'Multiple Configured-Grants Optimization in Grant-Free NOMA for mURLLC Service': {'doi':'10.1109/ICC45855.2022.9838541'},
            'Hierarchical Reinforcement Learning for Relay Selection and Power Optimization in Two-Hop Cooperative Relay Network': {'doi':'10.1109/TCOMM.2021.3119689'},
            'Optimization of Grant-free NOMA with Multiple Configured-Grants for mURLLC': {'doi':'10.1109/JSAC.2022.3143264'}
          }

          seen=set()
          for item in archive:
              title=item.get('title')
              if title in fixes:
                  item.update(fixes[title])
                  seen.add(title)
          missing=set(fixes)-seen
          if missing:
              raise SystemExit(f'Missing archive titles: {sorted(missing)}')

          recent.sort(key=lambda x: -x['year'])
          archive.sort(key=lambda x: -x['year'])
          combined = recent + archive
          titles=[x['title'].casefold() for x in combined]
          dois=[x['doi'].casefold() for x in combined if x.get('doi')]
          if len(titles) != len(set(titles)):
              raise SystemExit('duplicate title across publication data')
          if len(dois) != len(set(dois)):
              raise SystemExit('duplicate DOI across publication data')

          recent_path.write_text(json.dumps(recent, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications-archive.json
          git commit -m "content: audit 2022-2024 publication metadata"
          git push
