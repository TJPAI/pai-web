name: Refine results news dates once

on:
  push:
    branches:
      - refine/results-news-date-alignment

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Align results news dates and spacing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/results-news-date-alignment
          fetch-depth: 0
      - name: Apply refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('publications.html'), Path('en/publications.html')]:
              s = path.read_text(encoding='utf-8')
              s = s.replace('<time datetime="2026">2026</time><span>Ming Jiang', '<time datetime="2026-09">2026.09</time><span>Ming Jiang', 1)
              s = s.replace('<time datetime="2026">2026</time><span>Hexin Feng', '<time datetime="2026-03">2026.03</time><span>Hexin Feng', 1)
              s = s.replace('<time datetime="2026">2026</time><span>Hanfu Zhang', '<time datetime="2026-01">2026.01</time><span>Hanfu Zhang', 1)
              path.write_text(s, encoding='utf-8')

          css = Path('assets/css/refine.css')
          s = css.read_text(encoding='utf-8')
          s = s.replace('''  grid-template-columns:76px minmax(0,1fr);\n  gap:12px;\n  align-items:start;''', '''  grid-template-columns:68px minmax(0,1fr);\n  gap:10px;\n  align-items:baseline;''', 1)
          s = s.replace('''.results-news-row:last-child{border-bottom:0}''', '''.results-news-row:last-child{border-bottom:0;padding-bottom:4px}''', 1)
          s = s.replace('''.results-news-row time{color:#8B94A2;font-size:13px;line-height:1.55;font-variant-numeric:tabular-nums}''', '''.results-news-row time{color:#8B94A2;font-size:13px;line-height:1.55;font-variant-numeric:tabular-nums;position:relative;top:1px}''', 1)
          s = s.replace('''  .results-news{margin-top:28px;padding-top:20px}\n  .results-news h2{margin-bottom:4px;font-size:15px;font-weight:560;color:#4F5968}\n  .results-news-row{grid-template-columns:44px minmax(0,1fr);gap:7px;padding:8px 0}\n  .results-news-row time{font-size:10px;line-height:1.45}''', '''  .page-results .page-hero{padding-bottom:56px}\n  .results-news{margin-top:28px;padding-top:20px}\n  .results-news h2{margin-bottom:4px;font-size:15px;font-weight:560;color:#4F5968}\n  .results-news-row{grid-template-columns:50px minmax(0,1fr);gap:8px;padding:8px 0}\n  .results-news-row time{font-size:10px;line-height:1.45}''', 1)
          s = s.replace('''  .results-news-row{grid-template-columns:42px minmax(0,1fr);gap:6px}''', '''  .results-news-row{grid-template-columns:48px minmax(0,1fr);gap:7px}''', 1)
          css.write_text(s, encoding='utf-8')
          PY
      - name: Validate and remove temporary workflow
        run: |
          rm .github/workflows/refine-results-news-dates-once.yml
          python tools/validate_repository_hygiene.py
          python tools/validate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html assets/css/refine.css .github/workflows/refine-results-news-dates-once.yml
          git commit -m "Align results news dates and spacing"
          git push origin HEAD:refine/results-news-date-alignment
