name: Results remove first divider once

on:
  push:
    branches: [refine/results-remove-first-divider]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refine/results-remove-first-divider
      - name: Remove divider above first result only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          old = '.page-results .page-hero{padding-bottom:0}\n'
          new = '.page-results .page-hero{padding-bottom:0;border-bottom:0}\n.page-results .results-achievements .highlights{border-top:0}\n'
          if old not in s:
              raise SystemExit('Results hero rule not found')
          s = s.replace(old, new, 1)
          marker = '  .results-news{margin-top:28px;padding:20px 0}\n'
          add = marker + '  .page-results .results-achievements .highlight:first-child{border-top:0}\n'
          if marker not in s:
              raise SystemExit('Mobile results-news marker not found')
          s = s.replace(marker, add, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/results-remove-first-divider-once.yml
      - name: Validate hygiene and diff
        run: |
          python tools/validate_repository_hygiene.py
          git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/refine.css .github/workflows/results-remove-first-divider-once.yml
          git commit -m "Remove divider above first result"
          git push origin HEAD:refine/results-remove-first-divider
