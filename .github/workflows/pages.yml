name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate tooling syntax
        run: python -m py_compile tools/*.py
      - name: Validate environment matrix
        run: python tools/validate_environment_matrix.py
      - name: Validate shared head template
        run: python tools/sync_shared_head.py --check
      - name: Validate site content
        run: python tools/validate.py
      - name: Validate accessibility contracts
        run: python tools/validate_accessibility.py
      - name: Validate secure public links
        run: python tools/validate_secure_links.py
      - name: Validate manifest and icons
        run: python tools/validate_manifest.py
      - name: Prepare site URLs and crawl policy
        run: python tools/prepare_site_urls.py
      - name: Validate SEO contracts
        run: python tools/validate_seo_contracts.py
      - name: Validate homepage assets
        run: python tools/validate_home_assets.py
      - name: Validate CTA links
        run: python tools/validate_cta_links.py
      - name: Validate Outputs label
        run: python tools/validate_outputs_label.py
      - name: Prepare logo share metadata
        run: python tools/prepare_share_logo.py
      - name: Validate share metadata
        run: python tools/validate_share_metadata.py
      - name: Validate site runtime syntax
        run: node --check assets/js/site.js && node --check assets/js/home-logo.js && node --check sw.js && node --check assets/js/anchor-navigation.js
      - name: Validate navigation script references
        run: python tools/sync_navigation_scripts.py --check
      - name: Validate shared asset cache keys
        run: python tools/normalize_asset_versions.py --check
      - name: Prepare deployment runtime
        run: python tools/prepare_runtime.py
      - name: Validate prepared runtime syntax
        run: node --check assets/js/site.js
      - name: Bundle CSS for deployment
        run: python tools/prepare_css_bundle.py
      - name: Stamp deployed asset cache keys
        run: python tools/normalize_asset_versions.py
      - name: Stage public site artifact
        run: python tools/prepare_public_artifact.py
      - name: Validate public site artifact
        run: python tools/validate_public_artifact.py
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
