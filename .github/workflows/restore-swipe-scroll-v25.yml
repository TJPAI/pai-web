name: Restore swipe scroll v25
on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_swipe_scroll_v25.py'
      - '.github/workflows/restore-swipe-scroll-v25.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/restore_swipe_scroll_v25.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/restore_swipe_scroll_v25.py
          rm .github/workflows/restore-swipe-scroll-v25.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refine: restore remembered positions for swipe navigation'
          git push
