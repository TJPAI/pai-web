name: Final mobile polish
on:
  push:
    paths:
      - '.github/workflows/final-mobile-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply polish
        run: python tools/final_mobile_polish.py
      - name: Validate site
        run: python tools/validate.py
      - name: Commit polish and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-mobile-polish.yml tools/final_mobile_polish.py
          git add assets/css/app-core.css assets/css/refine.css '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html'
          git commit -m 'style: finish mobile visual micro-polish'
          git push
