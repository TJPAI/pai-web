name: Unify desktop breakpoint once

on:
  push:
    branches:
      - fix/unify-desktop-breakpoint

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-desktop-breakpoint
      - name: Align desktop min-width rules to 1025px
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('assets/css/desktop-layout.css'),
              Path('assets/css/typography.css'),
              Path('assets/css/refine.css'),
          ]
          total = 0
          for p in paths:
              text = p.read_text(encoding='utf-8')
              count = text.count('min-width:1100px')
              if count == 0:
                  raise SystemExit(f'{p}: no min-width:1100px found')
              text = text.replace('min-width:1100px', 'min-width:1025px')
              p.write_text(text, encoding='utf-8')
              print(f'{p}: replaced {count}')
              total += count
          print(f'total replacements: {total}')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/unify-desktop-breakpoint-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Unify desktop breakpoint at 1025px"
          git push origin HEAD:fix/unify-desktop-breakpoint
