name: Finalize homepage logo animation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-home-logo.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified MP4 and wire homepage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp/home-logo-complete-upload:refs/remotes/origin/tmp/home-logo-complete-upload
          mkdir -p assets/media assets/css assets/js

          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess

          ref='origin/tmp/home-logo-complete-upload'
          def show(path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True).strip()
          def git_blob_sha(text):
              b=text.encode('ascii')
              return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()

          # Six staged segments are exact. Segment 02 is known to be exactly one
          # base64 character short; repair it by matching immutable Git blob SHAs
          # for its eight 2 KB source slices.
          seg0=show('tmp/final-logo-00.b64')
          seg1=show('tmp/final-logo-01.b64')
          broken=show('tmp/final-logo-02.b64')
          seg3=show('tmp/final-logo-03.b64')
          seg4=show('tmp/final-logo-04.b64')
          seg5=show('tmp/final-logo-05.b64')
          seg6=show('tmp/final-logo-06.b64')

          expected_chunks=[
              '70a461fa12121aee524aef9b5927c76ed4f53825',
              '7e356fd7fd0492eed1611b59e878e1c6f8db5d60',
              'a7eb42ef7f3932498a915f84f573ecb1258acac4',
              'b9d06fa30f15f5ee982f63f743b6df5dea303616',
              '8ca929c76c3800ee9c67e88c8820c4068cb0a2ab',
              'da1561c27866d4e293bcc3cc0f4787886216e9b7',
              '1231f6398dd2064d90fab5d7777179bc29287ec2',
              '8d94dadb2be8a380d20131b7e57f830ec35500a8',
          ]
          if len(broken)!=15999:
              raise SystemExit(f'unexpected broken segment length: {len(broken)}')

          bad_index=None
          for i,sha in enumerate(expected_chunks):
              start=i*2000
              if len(broken)>=start+2000 and git_blob_sha(broken[start:start+2000])==sha:
                  continue
              bad_index=i
              break
          if bad_index is None:
              raise SystemExit('could not locate missing character')

          start=bad_index*2000
          prefix=broken[:start]
          damaged=broken[start:start+1999]
          suffix=broken[start+1999:]
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          repaired_chunk=None
          for pos in range(2000):
              left=damaged[:pos]
              right=damaged[pos:]
              for ch in alphabet:
                  candidate=left+ch+right
                  if git_blob_sha(candidate)==expected_chunks[bad_index]:
                      repaired_chunk=candidate
                      break
              if repaired_chunk is not None:
                  break
          if repaired_chunk is None:
              raise SystemExit('unable to repair missing base64 character')

          seg2=prefix+repaired_chunk+suffix
          if len(seg2)!=16000 or git_blob_sha(seg2)!='828ca1d98674a876b23fd152e0e25a465c93b8d4':
              raise SystemExit('repaired segment failed full Git blob verification')

          encoded=seg0+seg1+seg2+seg3+seg4+seg5+seg6
          data=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          if digest!='4a6686f46ce83314dd65a7a6caa7e32f7d4d77dd07447dfb7789cb0e68589707':
              raise SystemExit(f'final MP4 SHA256 mismatch: {digest}')
          if len(data)!=68343 or b'ftyp' not in data[:64] or b'moov' not in data[:4096] or b'mdat' not in data:
              raise SystemExit('final MP4 structural verification failed')
          Path('assets/media/pai-logo-motion.mp4').write_bytes(data)
          print(f'Verified homepage MP4: {len(data)} bytes sha256={digest}')
          PY

          cat > assets/css/home-logo.css <<'CSS'
          /* Homepage PAI logo motion; isolated from stable navigation/page-swipe CSS. */
          .home-hero .hero-art.pai-logo-motion-host{display:flex;align-items:center;justify-content:center}
          .home-hero .pai-logo-motion{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent}
          @media(max-width:768px){.home-hero .hero-art.pai-logo-motion-host{opacity:.72}}
          CSS

          cat > assets/js/home-logo.js <<'JS'
          (function(){
            'use strict';
            const normalizedPath=()=>{
              let path=location.pathname||'/';
              if(location.hostname==='tjpai.github.io'&&path.startsWith('/pai-web')) path=path.slice('/pai-web'.length)||'/';
              return path;
            };
            const isHome=()=>['/','/index.html','/en/','/en/index.html'].includes(normalizedPath());
            const mediaUrl=()=>{
              const prefix=location.hostname==='tjpai.github.io'?'/pai-web':'';
              return `${prefix}/assets/media/pai-logo-motion.mp4?v=20260920-01`;
            };
            let scheduled=false;
            const init=()=>{
              scheduled=false;
              if(!isHome()) return;
              const host=document.querySelector('.home-hero .hero-art');
              if(!host||host.dataset.paiLogoMotion==='1') return;
              host.dataset.paiLogoMotion='1';
              host.classList.add('pai-logo-motion-host');

              const video=document.createElement('video');
              video.className='pai-logo-motion';
              video.muted=true;
              video.defaultMuted=true;
              video.playsInline=true;
              video.setAttribute('playsinline','');
              video.setAttribute('webkit-playsinline','');
              video.preload='auto';
              video.setAttribute('aria-hidden','true');
              video.src=mediaUrl();

              const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
              if(reduced){
                video.addEventListener('loadedmetadata',()=>{
                  try{video.currentTime=Math.max(0,(video.duration||5)-0.04);}catch(_e){}
                },{once:true});
                video.addEventListener('seeked',()=>{host.replaceChildren(video);},{once:true});
              }else{
                video.autoplay=true;
                video.addEventListener('canplay',()=>{
                  host.replaceChildren(video);
                  video.play().catch(()=>{});
                },{once:true});
              }
            };
            const schedule=()=>{
              if(scheduled) return;
              scheduled=true;
              requestAnimationFrame(init);
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true});
            else schedule();
            new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
            addEventListener('popstate',schedule);
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          targets=[
              (Path('index.html'),'assets/css/home-logo.css?v=20260920-01','assets/js/home-logo.js?v=20260920-01'),
              (Path('en/index.html'),'../assets/css/home-logo.css?v=20260920-01','../assets/js/home-logo.js?v=20260920-01'),
          ]
          for path,css,js in targets:
              text=path.read_text()
              if css not in text:
                  marker='<link rel="icon" type="image/svg+xml"'
                  if marker not in text: raise SystemExit(f'CSS insertion marker missing in {path}')
                  text=text.replace(marker,f'<link rel="stylesheet" href="{css}">'+marker,1)
              if js not in text:
                  if '</body>' not in text: raise SystemExit(f'JS insertion marker missing in {path}')
                  text=text.replace('</body>',f'<script src="{js}"></script></body>',1)
              path.write_text(text)
          PY

          rm -rf tmp
          rm -f .github/workflows/finalize-home-logo.yml

          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
          node --check assets/js/home-logo.js

      - name: Commit finalized homepage logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add homepage PAI logo animation'
          git push origin HEAD:main
          git push origin --delete tmp/home-logo-complete-upload || true
