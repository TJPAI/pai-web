name: Merge industry into Outputs once
on:
  push:
    branches: [feature/outputs-integrate-industry-20261030]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Integrate and validate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          R=Path('.')
          for en in (False,True):
           prefix='en/' if en else ''
           publication=R/(prefix+'publications.html')
           industry=R/(prefix+'industry.html')
           s=publication.read_text(encoding='utf-8')
           old=industry.read_text(encoding='utf-8')
           # Retain all 12 individual items and the user's reported evidence/metrics.
           sections=re.findall(r'<section class="content-section industry-category".*?</section>',old,re.S)
           assert len(sections)==3, (prefix,len(sections))
           assert sum(len(re.findall(r'<article class="industry-card"',x)) for x in sections)==12
           cta=re.search(r'<section class="section industry-cta".*?</section>',old,re.S)
           assert cta
           for x in sections:
            assert 'industry-card' in x
           industry_block='<div class="results-industry" id="industry"><div class="container std"><div class="section-head"><div class="eyebrow">TECHNOLOGY & INDUSTRY</div><h2 class="title-section">'+('Industry Solutions & Collaboration' if en else '产业化技术与解决方案')+'</h2><p>'+('12 technologies for joint development, licensing and field deployment.' if en else '12项具备产业应用潜力的技术，面向项目验证、技术许可与联合开发。')+'</p></div></div>'+''.join(sections)+cta.group(0)+'</div>'
           marker='<section class="content-section results-publications"'
           assert s.count(marker)==1
           s=s.replace(marker,industry_block+marker,1)
           s=s.replace('<section class="results-achievements">','<section class="results-achievements" id="research-outputs">',1)
           s=s.replace('<section class="content-section results-publications">','<section class="content-section results-publications" id="papers">',1)
           # Keep existing 01-06 achievements and paper listing intact.
           s=s.replace('<h1 class="title-page">Outputs</h1>','<h1 class="title-page">Research Outputs & Collaboration</h1>') if en else s.replace('<h1 class="title-page">研究成果</h1>','<h1 class="title-page">成果合作</h1>')
           olddesc='Selected research achievements and recent academic publications.' if en else '代表性科研成果与近年代表性学术论文。'
           newdesc='Research achievements, industry-ready technologies and academic publications.' if en else '代表性科研成果、产业化技术及近年代表性学术论文。'
           s=s.replace(olddesc,newdesc)
           anchor='<nav class="results-jump-links" aria-label="'+('Outputs sections' if en else '成果合作板块')+'"><a href="#research-outputs">'+('Research results' if en else '研究成果')+'</a><a href="#industry">'+('Industry solutions' if en else '产业化技术')+'</a><a href="#papers">'+('Publications' if en else '代表性论文')+'</a></nav>'
           s=s.replace('<aside class="results-news"',anchor+'<aside class="results-news"',1)
           publication.write_text(s,encoding='utf-8')
           # Existing URLs: redirect with anchor preservation while retaining no-JS fallback.
           rel='publications.html'
           script='<script>(function(){var h=location.hash||"#industry";location.replace("'+rel+'"+h)})();</script>'
           old=old.replace('</head>',script+'</head>',1)
           old=old.replace('<link rel="canonical" href="https://ai.tongji.edu.cn/'+prefix+'industry.html">','<link rel="canonical" href="https://ai.tongji.edu.cn/'+prefix+'publications.html#industry">',1)
           industry.write_text(old,encoding='utf-8')
          # Replace all menu labels and remove independent Industry navigation.
          files=list(R.glob('*.html'))+list((R/'en').glob('*.html'))+list((R/'people').glob('*.html'))+list((R/'en/people').glob('*.html'))
          for f in files:
           if f.name=='404.html':continue
           s=f.read_text(encoding='utf-8')
           en=f.parts[0]=='en'
           s=re.sub(r'<a(?: class="active")? href="(?:\.\./)?industry\.html">(?:Industry|产业合作)</a>','',s)
           if not en:s=s.replace('>研究成果</a>','>成果合作</a>')
           # From home technology samples, old dedicated page -> sections on Results page.
           if f.name=='index.html':
            s=s.replace('industry.html#tech-','publications.html#tech-').replace('industry.html#main-content','publications.html#industry')
           f.write_text(s,encoding='utf-8')
          js=R/'assets/js/site.js'
          s=js.read_text(encoding='utf-8')
          s=s.replace("['Outputs','/en/publications.html'],['Industry','/en/industry.html']","['Outputs','/en/publications.html']")
          s=s.replace("['研究成果','/publications.html'],['产业合作','/industry.html']","['成果合作','/publications.html']")
          s=s.replace("'/publications.html','/industry.html','/join.html'","'/publications.html','/join.html'")
          s=s.replace("'/en/publications.html','/en/industry.html','/en/join.html'","'/en/publications.html','/en/join.html'")
          # Do not break historic Industry URL language mapping and path resolver.
          js.write_text(s,encoding='utf-8')
          css=R/'assets/css/refine.css'
          css.write_text(css.read_text(encoding='utf-8')+"""
          /* Merged Outputs sections share the existing typography and divider system. */
          .results-jump-links{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:28px;font-size:13px;color:#596577}
          .results-jump-links a{color:inherit;text-decoration:none;border-bottom:1px solid #B8C0CB;padding-bottom:6px}
          .results-jump-links a:hover{color:var(--ink);border-color:var(--ink)}
          .results-industry{padding-top:68px;border-top:1px solid var(--line)}
          .results-industry>.container>.section-head{margin-bottom:22px}
          .results-industry>.container>.section-head p{max-width:700px;color:var(--muted)}
          .page-results .results-industry .industry-category{padding:30px 0 66px}
          .page-results .results-industry .industry-category:nth-of-type(even){background:#F8F9FB}
          .page-results .results-industry .industry-cta{padding:54px 0 72px}
          @media(max-width:768px){.results-jump-links{gap:14px;margin-top:22px;font-size:12px}.results-industry{padding-top:48px}.page-results .results-industry .industry-category{padding:26px 0 46px}}
          """,encoding='utf-8')
          # avoid temporary workflow being shipped
          (Path('.github/workflows/outputs-merge-once.yml')).unlink(missing_ok=True)
          checks=[['node','--check','assets/js/site.js'],['python','tools/validate_repository_hygiene.py'],['python','tools/sync_shared_head.py','--check'],['python','tools/normalize_asset_versions.py','--check'],['python','tools/validate.py'],['python','tools/validate_outputs_label.py'],['python','tools/validate_share_metadata.py'],['git','diff','--check']]
          for check in checks:subprocess.run(check,check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','Unify industry technologies under bilingual Outputs'],check=True)
          subprocess.run(['git','push','origin','HEAD'],check=True)
          
          PY
