name: Apply results latest-news layout once

on:
  push:
    branches:
      - feature/results-latest-news

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply results latest-news layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/results-latest-news
          fetch-depth: 0
      - name: Update bilingual results hero and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          zh = Path('publications.html')
          en = Path('en/publications.html')
          css = Path('assets/css/refine.css')

          zh_text = zh.read_text(encoding='utf-8')
          en_text = en.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')

          zh_old = '<section class="page-hero divider-wide"><div class="container std"><div class="eyebrow">RESEARCH RESULTS</div><h1 class="title-page">研究成果</h1><p>代表性科研成果与近年代表性学术论文。</p></div></section>'
          zh_new = '''<section class="page-hero divider-wide"><div class="container std"><div class="eyebrow">RESEARCH RESULTS</div><h1 class="title-page">研究成果</h1><p>代表性科研成果与近年代表性学术论文。</p><aside class="results-news" id="latest-news" aria-labelledby="latest-news-title"><h2 id="latest-news-title">最新动态</h2><div class="results-news-list"><a class="results-news-row" href="https://doi.org/10.1109/COMST.2026.3729997" target="_blank" rel="noopener noreferrer"><time datetime="2026">2026</time><span>DePIN综述论文发表于 IEEE Communications Surveys &amp; Tutorials</span></a><a class="results-news-row" href="https://doi.org/10.1109/TVT.2026.3721188" target="_blank" rel="noopener noreferrer"><time datetime="2026">2026</time><span>透地磁感应通信研究发表于 IEEE Transactions on Vehicular Technology</span></a><div class="results-news-row"><time datetime="2025-06">2025.06</time><span>IEEE Global Blockchain Conference 2025 在上海举办</span></div></div></aside></div></section>'''

          en_old = '<section class="page-hero divider-wide"><div class="container std"><div class="eyebrow">RESEARCH RESULTS</div><h1 class="title-page">Outputs</h1><p>Selected research achievements and recent academic publications.</p></div></section>'
          en_new = '''<section class="page-hero divider-wide"><div class="container std"><div class="eyebrow">RESEARCH RESULTS</div><h1 class="title-page">Outputs</h1><p>Selected research achievements and recent academic publications.</p><aside class="results-news" id="latest-news" aria-labelledby="latest-news-title"><h2 id="latest-news-title">Latest News</h2><div class="results-news-list"><a class="results-news-row" href="https://doi.org/10.1109/COMST.2026.3729997" target="_blank" rel="noopener noreferrer"><time datetime="2026">2026</time><span>DePIN survey published in IEEE Communications Surveys &amp; Tutorials</span></a><a class="results-news-row" href="https://doi.org/10.1109/TVT.2026.3721188" target="_blank" rel="noopener noreferrer"><time datetime="2026">2026</time><span>Through-the-Earth magnetic induction study published in IEEE Transactions on Vehicular Technology</span></a><div class="results-news-row"><time datetime="2025-06">2025.06</time><span>IEEE Global Blockchain Conference 2025 held in Shanghai</span></div></div></aside></div></section>'''

          if zh_text.count(zh_old) != 1:
              raise SystemExit(f'Chinese hero anchor count: {zh_text.count(zh_old)}')
          if en_text.count(en_old) != 1:
              raise SystemExit(f'English hero anchor count: {en_text.count(en_old)}')

          zh.write_text(zh_text.replace(zh_old, zh_new, 1), encoding='utf-8')
          en.write_text(en_text.replace(en_old, en_new, 1), encoding='utf-8')

          marker = '/* Results hero latest-news panel */'
          if marker in css_text:
              raise SystemExit('Results news CSS already exists')
          css_add = r'''

/* Results hero latest-news panel */
.page-results .page-hero>.container.std{
  display:grid;
  grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);
  grid-template-rows:auto auto 1fr;
  column-gap:clamp(38px,6vw,86px);
  align-items:start;
}
.page-results .page-hero>.container.std>.eyebrow,
.page-results .page-hero>.container.std>.title-page,
.page-results .page-hero>.container.std>p{grid-column:1}
.page-results .page-hero>.container.std>.eyebrow{grid-row:1}
.page-results .page-hero>.container.std>.title-page{grid-row:2}
.page-results .page-hero>.container.std>p{grid-row:3}
.results-news{
  grid-column:2;
  grid-row:1 / span 3;
  min-width:0;
  padding-left:clamp(30px,4vw,54px);
  border-left:1px solid var(--line);
}
.results-news h2{
  margin:0 0 16px;
  font-size:20px;
  line-height:1.25;
  font-weight:650;
  letter-spacing:-.015em;
}
.results-news-list{border-top:0}
.results-news-row{
  display:grid;
  grid-template-columns:78px minmax(0,1fr);
  gap:18px;
  align-items:start;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  color:inherit;
  text-decoration:none;
}
.results-news-row:last-child{border-bottom:0}
.results-news-row time{
  color:#8B94A2;
  font-size:13px;
  line-height:1.55;
  font-variant-numeric:tabular-nums;
}
.results-news-row span{
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  font-weight:560;
}
@media(hover:hover) and (pointer:fine){
  a.results-news-row:hover span{text-decoration:underline;text-underline-offset:3px}
}
@media(max-width:768px){
  .page-results .page-hero>.container.std{
    grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);
    column-gap:18px;
  }
  .page-results .page-hero>.container.std>.title-page{font-size:clamp(38px,10.5vw,52px)}
  .page-results .page-hero>.container.std>p{font-size:clamp(13px,3.7vw,17px);line-height:1.55}
  .results-news{padding-left:16px}
  .results-news h2{margin-bottom:8px;font-size:15px}
  .results-news-row{grid-template-columns:52px minmax(0,1fr);gap:8px;padding:7px 0}
  .results-news-row time{font-size:10px;line-height:1.45}
  .results-news-row span{font-size:11px;line-height:1.45;font-weight:570}
}
@media(max-width:380px){
  .page-results .page-hero>.container.std{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:14px}
  .results-news{padding-left:12px}
  .results-news-row{grid-template-columns:46px minmax(0,1fr);gap:6px}
  .results-news-row span{font-size:10.5px}
}
'''
          css.write_text(css_text + css_add, encoding='utf-8')
          PY
      - name: Validate repository hygiene
        run: |
          rm .github/workflows/results-news-once.yml
          python tools/validate_repository_hygiene.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html assets/css/refine.css .github/workflows/results-news-once.yml
          git commit -m "Apply results latest-news layout"
          git push origin HEAD:feature/results-latest-news
