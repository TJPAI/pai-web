name: Bump homepage logo cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-home-logo-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump home logo script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html','en/index.html'):
              p=Path(name)
              s=p.read_text()
              old='home-logo.js?v=20260920-03'
              new='home-logo.js?v=20260921-01'
              if old not in s:
                  raise SystemExit(f'{name}: expected old cache key not found')
              p.write_text(s.replace(old,new))
          PY
      - name: Validate
        run: |
          python tools/sync_shared_head.py --check
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
          node --check assets/js/home-logo.js
          node --check sw.js
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bump-home-logo-cache.yml
          git add index.html en/index.html
          git commit -m 'fix: refresh WeChat homepage logo motion script'
          git push
