name: Stabilize WeChat homepage head

on:
  push:
    paths:
      - '.github/workflows/wechat-head-stabilize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage head only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('index.html'), Path('en/index.html')]:
              s = path.read_text()
              # Remove experimental direct/preload references to internal CSS layers.
              s = re.sub(r'<link rel="(?:stylesheet|preload)"(?: as="style")? href="(?:\.\./)?assets/css/(?:refine-base|app-core|typography)\.css\?v=[^"]+">', '', s)
              # Stabilize iOS WebView viewport without disabling user zoom.
              s = s.replace('content="width=device-width,initial-scale=1"', 'content="width=device-width,initial-scale=1,viewport-fit=cover"', 1)
              style = '<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>'
              if style not in s:
                  marker = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
                  s = s.replace(marker, marker + style, 1)
              # Detect iOS WeChat before first paint; future scoped fixes can use this class.
              early = "<script>(function(){var u=navigator.userAgent||'';if(/MicroMessenger/i.test(u)&&/(iPhone|iPad|iPod)/i.test(u))document.documentElement.classList.add('pai-wechat-ios')})();</script>"
              if 'pai-wechat-ios' not in s:
                  s = s.replace(style, style + early, 1)
              s = re.sub(r'assets/css/refine\.css\?v=[^"\']+', 'assets/css/refine.css?v=20260921-03', s)
              path.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/wechat-head-stabilize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize iOS WeChat homepage viewport'
          git push
