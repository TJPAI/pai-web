name: One-off consolidate typography

on:
  push:
    paths:
      - '.github/workflows/consolidate-typography.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Consolidate typography ownership
        run: python tools/consolidate_typography.py
      - name: Validate
        run: python tools/validate.py && node --check assets/js/site.js && node --check sw.js
      - name: Commit cleanup
        run: |
          rm tools/consolidate_typography.py
          rm .github/workflows/consolidate-typography.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css assets/css/refine-base.css assets/css/app-core.css assets/css/typography.css tools/validate.py tools/consolidate_typography.py .github/workflows/consolidate-typography.yml
          git commit -m 'refactor: make typography layer the single title source'
          git push origin HEAD:main
