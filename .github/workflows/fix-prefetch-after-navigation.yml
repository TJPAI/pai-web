name: One-off warm links after in-page navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-prefetch-after-navigation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm links after every same-origin page swap
        run: >-
          python -c "from pathlib import Path; p=Path('assets/js/site.js'); s=p.read_text(); old='      renderChrome();\n      initPublications([]);\n      if(Number.isFinite(preserveScrollY)){'; new='      renderChrome();\n      initPublications([]);\n      setTimeout(()=>warmNavigation(),80);\n      if(Number.isFinite(preserveScrollY)){'; assert old in s, 'target applyPage block not found'; p.write_text(s.replace(old,new,1))"
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused fix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-prefetch-after-navigation.yml
          git add assets/js/site.js .github/workflows/fix-prefetch-after-navigation.yml
          git commit -m 'perf: warm body links after in-page navigation'
          git push
