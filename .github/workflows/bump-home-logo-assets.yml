name: Bump homepage logo asset versions
on:
  push:
    paths:
      - '.github/workflows/bump-home-logo-assets.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache keys and remove one-shot workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              text=p.read_text()
              text=text.replace('refine.css?v=20260920-25','refine.css?v=20260920-26')
              text=text.replace('home-logo.css?v=20260920-01','home-logo.css?v=20260920-02')
              text=text.replace('home-logo.js?v=20260920-01','home-logo.js?v=20260920-02')
              p.write_text(text)
          PY
          rm -f .github/workflows/bump-home-logo-assets.yml
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
          node --check assets/js/home-logo.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh homepage logo asset cache keys'
          git push origin HEAD:main
