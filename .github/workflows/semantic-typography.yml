name: One-off semantic typography migration
on:
  push:
    paths:
      - 'tools/_migrate_semantic_typography.py'
      - '.github/workflows/semantic-typography.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Migrate semantic typography classes
        run: |
          python tools/_migrate_semantic_typography.py
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit migration and remove one-off files
        run: |
          rm tools/_migrate_semantic_typography.py
          rm .github/workflows/semantic-typography.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: adopt semantic title hierarchy across site'
          git push origin HEAD:main
