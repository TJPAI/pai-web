name: Boda consolidated release without Industry pages
on:
  push:
    branches: [release/boda-consolidated-no-industry-20261030]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build verified Boda package
        run: |
          python tools/package_boda.py --output pai-web-boda-final-2026-10-30.zip
          python - <<'PY'
          import pathlib,zipfile,hashlib
          p=pathlib.Path('pai-web-boda-final-2026-10-30.zip')
          with zipfile.ZipFile(p) as z:
            names=set(z.namelist())
            assert z.testzip() is None
            assert 'industry.html' not in names and 'en/industry.html' not in names
            for file in ('publications.html','en/publications.html','assets/js/site.js','assets/css/refine-bundle.css'):
              assert file in names, file
            assert b'High-Level Expert Panel on AGI convened by' in z.read('en/publications.html')
            assert b'RTX 3090' in z.read('en/publications.html')
            assert b'Industry Technologies' in z.read('en/publications.html')
            assert b'/industry.html' not in z.read('assets/js/site.js')
            print('Files:',len(names),'Size:',p.stat().st_size,'SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda-final-2026-10-30
          path: pai-web-boda-final-2026-10-30.zip
          retention-days: 30
