name: Cleanup refresh v34
on:
  push:
    paths:
      - '.github/workflows/cleanup-refresh-v34.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary refresh files
        run: |
          rm -f .pages-refresh-swipe-v34 .github/workflows/cleanup-refresh-v34.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary swipe cleanup files'
          git push
