name: Package Boda site temp

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify teacher JPG assets
        run: |
          test -f assets/images/people/dunhui-xiao.jpg
          test -f assets/images/people/erwu-liu.jpg
          test -f assets/images/people/gang-shen.jpg
          test -f assets/images/people/rui-wang.jpg
          test -f assets/images/people/shuyan-hu.jpg
          test -f assets/images/people/yan-liu.jpg
      - name: Build deployment CSS bundle
        run: python tools/prepare_css_bundle.py
      - name: Stamp deployed asset cache keys
        run: python tools/normalize_asset_versions.py
      - name: Stage public website
        run: python tools/prepare_public_artifact.py
      - name: Remove GitHub Pages-only CNAME
        run: rm -f _site/CNAME
      - name: Package website
        run: |
          cd _site
          zip -qr ../pai-web-boda.zip .
      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda
          path: pai-web-boda.zip
          if-no-files-found: error
          retention-days: 30
