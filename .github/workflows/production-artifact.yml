name: Build production server artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and validate production server package
        run: python tools/package_boda.py --output pai-web-production.zip

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-production
          path: pai-web-production.zip
          if-no-files-found: error
          retention-days: 30
