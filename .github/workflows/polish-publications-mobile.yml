name: One-off publications mobile rhythm polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-publications-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine Publications mobile reading rhythm
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app-core.css')
          t=p.read_text(encoding='utf-8')
          marker='''  .pub-back-top{right:18px;bottom:92px}\n}'''
          replacement='''  .pub-back-top{right:18px;bottom:92px}\n  /* Give long publication lists a calmer editorial rhythm on phones. */\n  .pub{padding:27px 0 29px}\n  .pub h3{margin-bottom:11px}\n  .pub-authors{line-height:1.68!important;margin-top:0!important}\n  .pub-venue{line-height:1.62!important;margin-top:5px!important}\n  .pub-actions{margin-top:12px}\n}'''
          if marker not in t:
              raise SystemExit('publications mobile block marker not found')
          t=t.replace(marker,replacement,1)
          p.write_text(t,encoding='utf-8')
          PY
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused polish and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/polish-publications-mobile.yml
          git add assets/css/app-core.css
          git commit -m 'style: improve mobile publication reading rhythm'
          git push origin HEAD:main
