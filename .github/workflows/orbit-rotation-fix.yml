name: Orbit rotation migration
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch orbit rotation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          js=Path('assets/js/site.js')
          s=js.read_text(encoding='utf-8')
          s=s.replace("'a,button,input,textarea,select,option,label,[contenteditable=\"true\"],[role=\"button\"],[data-no-swipe]'", "'.pai-orbit,a,button,input,textarea,select,option,label,[contenteditable=\"true\"],[role=\"button\"],[data-no-swipe]'", 1)
          s=s.replace("const paint=()=>{wheel.querySelectorAll('defs path').forEach((path,i)=>path.setAttribute('d',arcPath(i*45+rotation,i)));};", "const paint=()=>{wheel.style.setProperty('--orbit-rotation',rotation+'deg');};", 1)
          marker="  wheel.addEventListener('pointercancel',()=>{dragging=false;});"
          extra="""  wheel.addEventListener('pointercancel',()=>{dragging=false;});
  wheel.addEventListener('touchstart',e=>{if(!orbit.classList.contains('open')||e.touches.length!==1)return;e.stopPropagation();dragging=true;moved=false;startAngle=pointAngle(e);startRotation=rotation;},{passive:true});
  wheel.addEventListener('touchmove',e=>{if(!dragging||e.touches.length!==1)return;e.preventDefault();e.stopPropagation();const delta=pointAngle(e)-startAngle;if(Math.abs(delta)>3)moved=true;rotation=startRotation+delta;paint();},{passive:false});
  wheel.addEventListener('touchend',e=>{if(dragging)e.stopPropagation();dragging=false;},{passive:true});
  wheel.addEventListener('touchcancel',e=>{if(dragging)e.stopPropagation();dragging=false;},{passive:true});"""
          if "touchstart',e=>{if(!orbit.classList.contains('open')" not in s:
              if marker not in s: raise SystemExit('pointer marker not found')
              s=s.replace(marker,extra,1)
          js.write_text(s,encoding='utf-8')

          css=Path('assets/css/app-core.css')
          c=css.read_text(encoding='utf-8')
          c=c.replace('transform:translate(-50%,-50%) scale(.22);', 'transform:translate(-50%,-50%) scale(.22) rotate(var(--orbit-rotation,0deg));', 1)
          c=c.replace('transform:translate(-50%,-50%) scale(1);pointer-events:auto', 'transform:translate(-50%,-50%) scale(1) rotate(var(--orbit-rotation,0deg));pointer-events:auto', 1)
          css.write_text(c,encoding='utf-8')

          refine=Path('assets/css/refine.css')
          r=refine.read_text(encoding='utf-8').replace('app-core.css?v=20260920-17','app-core.css?v=20260920-18')
          refine.write_text(r,encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              h=p.read_text(encoding='utf-8')
              h=re.sub(r'refine\.css\?v=[0-9-]+','refine.css?v=20260920-18',h)
              h=re.sub(r'site\.js\?v=[0-9-]+','site.js?v=20260920-54',h)
              p.write_text(h,encoding='utf-8')
          PY
          node --check assets/js/site.js
          python tools/validate.py
          python tools/validate_share_metadata.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'fix: restore orbit drag rotation on iPhone'
          git push
