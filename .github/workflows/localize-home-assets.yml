name: Localize homepage assets
on:
  push:
    branches:
      - tmp/localize-home-webp
    paths:
      - '.github/workflows/localize-home-assets.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/localize-home-webp
      - name: Assemble assets and update pages
        run: python .tmp-home-assets/assemble.py
      - name: Validate
        run: |
          python tools/sync_shared_head.py --check
          python tools/validate.py
      - name: Commit localized assets and clean staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/home index.html en/index.html
          git rm -r .tmp-home-assets .github/workflows/localize-home-assets.yml
          git commit -m 'assets: localize homepage research imagery'
          git push origin HEAD:tmp/localize-home-webp
