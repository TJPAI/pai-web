name: Bump desktop polish cache keys
on:
  push:
    paths:
      - '.github/workflows/desktop-polish-cache-bump.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump CSS cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              n=s.replace('refine.css?v=20260920-26','refine.css?v=20260920-27')
              n=n.replace('home-logo.css?v=20260920-03','home-logo.css?v=20260920-04')
              if n!=s:
                  p.write_text(n,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/desktop-polish-cache-bump.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: refresh desktop orbit and logo placement' || exit 0
          git push
