name: Unify preview scroll v46
on:
  push:
    paths:
      - 'tools/unify_preview_scroll_v46.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/unify_preview_scroll_v46.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm tools/unify_preview_scroll_v46.py .github/workflows/unify-preview-scroll-v46.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use exact saved scroll in swipe preview'
          git push
