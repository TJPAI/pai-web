name: One-off cooperation title cache refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-collaboration-and-gbc.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen mobile cooperation titles and bust About CSS cache
        shell: python
        run: |
          from pathlib import Path

          css=Path('assets/css/app-core.css')
          s=css.read_text(encoding='utf-8')
          old='@media(max-width:768px){#collaboration .partner h3{font-size:21px;line-height:1.38}}'
          new='@media(max-width:768px){#collaboration .partner h3{font-size:24px!important;line-height:1.34;font-weight:650}}'
          if old not in s:
            raise SystemExit('mobile collaboration title rule not found')
          css.write_text(s.replace(old,new,1),encoding='utf-8')

          pages=[
            (Path('about.html'),'assets/css/refine.css','assets/css/refine.css?v=20260919-1'),
            (Path('en/about.html'),'../assets/css/refine.css','../assets/css/refine.css?v=20260919-1'),
          ]
          for path,old_href,new_href in pages:
            t=path.read_text(encoding='utf-8')
            if new_href not in t:
              if old_href not in t:
                raise SystemExit(f'stylesheet href not found in {path}')
              t=t.replace(old_href,new_href,1)
            path.write_text(t,encoding='utf-8')
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused fix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/update-collaboration-and-gbc.yml
          git add about.html en/about.html assets/css/app-core.css .github/workflows/update-collaboration-and-gbc.yml
          git commit -m 'fix: make cooperation headings visibly larger on mobile'
          git push
