name: One-off Gang Shen image conversion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gang-shen.yml'

permissions:
  contents: write

jobs:
  fix-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and convert portrait
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          url = 'https://ai.tongji.edu.cn/new_web/image/shengang.jpg'
          req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urlopen(req, timeout=30) as r:
              data = r.read()
          img = Image.open(BytesIO(data)).convert('RGB')
          out = Path('assets/images/people/gang-shen.png')
          img.save(out, format='PNG', optimize=True)

          replacements = {
              'team.html': ('assets/images/people/gang-shen.jpg', 'assets/images/people/gang-shen.png'),
              'people/gang-shen.html': ('../assets/images/people/gang-shen.jpg', '../assets/images/people/gang-shen.png'),
              'en/team.html': ('../assets/images/people/gang-shen.jpg', '../assets/images/people/gang-shen.png'),
              'en/people/gang-shen.html': ('../../assets/images/people/gang-shen.jpg', '../../assets/images/people/gang-shen.png'),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected reference in {name}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          old = Path('assets/images/people/gang-shen.jpg')
          if old.exists():
              old.unlink()
          print('converted', img.size, img.format)
          PY
      - name: Commit image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/people/gang-shen.png assets/images/people/gang-shen.jpg team.html people/gang-shen.html en/team.html en/people/gang-shen.html
          git commit -m 'fix: replace Gang Shen portrait with PNG'
          git push origin HEAD:main
