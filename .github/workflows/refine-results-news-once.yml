name: Refine results news once

on:
  push:
    branches:
      - "refine/results-news-mobile"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "refine/results-news-mobile"
          fetch-depth: 0
      - run: python tools/refine_results_news_once.py
      - run: |
          rm tools/refine_results_news_once.py
          rm .github/workflows/refine-results-news-once.yml
          python tools/validate_repository_hygiene.py
          python tools/validate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html en/publications.html assets/css/refine.css tools/refine_results_news_once.py .github/workflows/refine-results-news-once.yml
          git commit -m "Refine results news mobile layout"
          git push origin HEAD:refine/results-news-mobile
