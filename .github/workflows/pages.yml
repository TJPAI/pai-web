name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shared head template
        run: python tools/sync_shared_head.py --check
      - name: Validate site content
        run: python tools/validate.py
      - name: Validate share metadata
        run: python tools/validate_share_metadata.py
      - name: Validate site runtime syntax
        run: node --check assets/js/site.js && node --check sw.js
      - name: Use Outputs in English navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/site.js')
          text = path.read_text(encoding='utf-8')
          old = "['Research Results','/en/publications.html']"
          new = "['Outputs','/en/publications.html']"
          if old not in text:
              raise SystemExit('Expected English navigation label not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Hide orbit menu while mobile navigation is open
        run: |
          printf '\n@media(max-width:768px){body:has(.mobile-menu.open) .pai-orbit{display:none!important}}\n' >> assets/css/refine.css
      - name: Normalize shared asset cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          refine_version = "20260925-05"
          site_js_version = "20260925-01"
          refine_pattern = re.compile(r"refine\.css\?v=[0-9-]+")
          site_js_pattern = re.compile(r"site\.js\?v=[0-9-]+")
          changed = 0
          for path in Path(".").rglob("*.html"):
              if "geosketch-mvp" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = refine_pattern.sub(f"refine.css?v={refine_version}", text)
              updated = site_js_pattern.sub(f"site.js?v={site_js_version}", updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1
          print(f"Normalized refine.css and site.js cache keys in {changed} HTML files")
          PY
      - name: Tighten publication year divider spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '.results-publications .publication-toolbar{border-bottom:1px solid var(--line)!important;padding-bottom:24px!important}'
          new = '.results-publications .publication-toolbar{border-bottom:1px solid var(--line)!important;padding-bottom:4px!important}'
          for name in ('publications.html', 'en/publications.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Tightened divider spacing in {name}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
