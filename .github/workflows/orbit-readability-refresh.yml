name: Orbit readability migration
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch orbit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          js = Path('assets/js/site.js')
          s = js.read_text(encoding='utf-8')
          s = s.replace("const defs=data.map((_,i)=>`<path id=\"orbit-arc-${i}\" d=\"${arcPath(i*45,i)}\"/>`).join('');", "const defs=data.map((_,i)=>`<path id=\"orbit-arc-${i}\" d=\"${arcPath(i*45+rotation,i)}\"/>`).join('');")
          s = s.replace("const setOpen=open=>{orbit.classList.toggle('open',open);toggle.setAttribute('aria-expanded',open?'true':'false');sync();paint();};", "const setOpen=open=>{orbit.classList.toggle('open',open);toggle.setAttribute('aria-expanded',open?'true':'false');sync();};")
          s = s.replace("const paint=()=>{wheel.style.setProperty('--orbit-rotation',rotation+'deg');};", "const paint=()=>{wheel.querySelectorAll('defs path').forEach((path,i)=>path.setAttribute('d',arcPath(i*45+rotation,i)));};")
          js.write_text(s, encoding='utf-8')

          css = Path('assets/css/app-core.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('--orbit-size:min(52vw,220px);--orbit-x:50%;--orbit-y:73%', '--orbit-size:min(52vw,220px);--orbit-x:50%;--orbit-y:calc(100dvh - 122px)')
          c = c.replace('scale(.22) rotate(var(--orbit-rotation,0deg))', 'scale(.22)')
          c = c.replace('scale(1) rotate(var(--orbit-rotation,0deg))', 'scale(1)')
          c = c.replace('--orbit-size:min(54vw,210px);--orbit-y:74%', '--orbit-size:min(54vw,210px);--orbit-y:calc(100dvh - 117px)')
          c = c.replace('--orbit-size:240px;--orbit-y:70%', '--orbit-size:240px;--orbit-y:calc(100dvh - 136px)')
          css.write_text(c, encoding='utf-8')

          refine = Path('assets/css/refine.css')
          r = refine.read_text(encoding='utf-8').replace('app-core.css?v=20260920-16','app-core.css?v=20260920-17')
          refine.write_text(r, encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              h = p.read_text(encoding='utf-8')
              h = re.sub(r'refine\.css\?v=[0-9-]+', 'refine.css?v=20260920-17', h)
              h = re.sub(r'site\.js\?v=[0-9-]+', 'site.js?v=20260920-53', h)
              p.write_text(h, encoding='utf-8')
          PY
          node --check assets/js/site.js
          python tools/validate.py
          python tools/validate_share_metadata.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/site.js assets/css/app-core.css assets/css/refine.css '*.html' 'en/*.html' 'people/*.html' 'en/people/*.html'
          git diff --cached --quiet || git commit -m 'fix: lower orbit and normalize rotating labels'
          git push
