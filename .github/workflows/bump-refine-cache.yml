name: Bump refine cache

on:
  push:
    paths:
      - '.github/workflows/bump-refine-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump homepage refine cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','en/index.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('refine.css?v=20260920-27','refine.css?v=20260921-01')
              p.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/bump-refine-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh homepage refine cache key'
          git push
