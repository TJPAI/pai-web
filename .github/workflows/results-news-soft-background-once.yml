name: Results news soft background once

on:
  push:
    branches: [refine/results-news-soft-background]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/results-news-soft-background
      - name: Apply matching soft background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          old = '''.results-news{\n  min-width:0;\n  margin-top:34px;\n  padding-top:24px;\n  border-top:1px solid var(--line);\n}'''
          new = '''.results-news{\n  min-width:0;\n  margin-top:34px;\n  padding:24px;\n  border-top:1px solid var(--line);\n  background:var(--soft);\n}'''
          if old not in s:
              raise SystemExit('Expected results-news block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/results-news-soft-background-once.yml
      - name: Validate hygiene
        run: python tools/validate_repository_hygiene.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/refine.css
          git commit -m 'Use soft background for latest news'
          git push origin HEAD:refine/results-news-soft-background
