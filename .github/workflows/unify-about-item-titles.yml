name: One-off unify About item title hierarchy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-about-item-titles.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify About item titles
        shell: python
        run: |
          from pathlib import Path

          base=Path('assets/css/refine-base.css')
          s=base.read_text(encoding='utf-8')
          old='.partner{padding:25px 0!important}.partner h3{font-size:24px!important;line-height:1.34!important;color:var(--ink)!important;font-weight:650;margin-bottom:8px!important}.partner-inline{font-size:15px!important;color:var(--muted)!important;line-height:1.6}'
          new='.partner{padding:25px 0!important}.home-hero~.section .partner h3{font-size:14px!important;line-height:1.34!important;color:var(--ink)!important;font-weight:620;margin-bottom:8px!important}.partner-inline{font-size:15px!important;color:var(--muted)!important;line-height:1.6}'
          if old not in s:
            raise SystemExit('expected mobile partner rule not found')
          base.write_text(s.replace(old,new,1),encoding='utf-8')

          core=Path('assets/css/app-core.css')
          s=core.read_text(encoding='utf-8')
          old_block='''/* International impact platform titles */\n#international-impact .detail-block h3{font-size:18px;line-height:1.35;font-weight:650;letter-spacing:-.01em}\n#international-impact .impact-link{color:inherit;text-decoration:none}\n#international-impact .impact-link:hover,#international-impact .impact-link:focus-visible{text-decoration:underline;text-underline-offset:3px}\n@media(max-width:768px){#international-impact .detail-block h3{font-size:21px;line-height:1.34}}\n'''
          new_block='''/* About page item-title hierarchy */\n#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:18px;line-height:1.35;font-weight:650;letter-spacing:-.01em}\n#international-impact .impact-link{color:inherit;text-decoration:none}\n#international-impact .impact-link:hover,#international-impact .impact-link:focus-visible{text-decoration:underline;text-underline-offset:3px}\n@media(max-width:768px){#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:21px!important;line-height:1.34!important;font-weight:650}}\n'''
          if old_block not in s:
            raise SystemExit('expected impact title block not found')
          core.write_text(s.replace(old_block,new_block,1),encoding='utf-8')
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused change and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/unify-about-item-titles.yml
          git add assets/css/refine-base.css assets/css/app-core.css .github/workflows/unify-about-item-titles.yml
          git commit -m 'style: unify About item title hierarchy'
          git push
