name: One-off unify About item title presentation
on:
  push:
    paths:
      - '.github/workflows/fix-about-item-title-color.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify About item title color and weight
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app-core.css')
          s=p.read_text()
          old='#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:18px;line-height:1.35;font-weight:650;letter-spacing:-.01em}'
          new='#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:18px;line-height:1.35;font-weight:650;letter-spacing:-.01em;color:var(--ink)!important}'
          assert old in s
          s=s.replace(old,new,1)
          old2='@media(max-width:768px){#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:21px!important;line-height:1.34!important;font-weight:650}}'
          new2='@media(max-width:768px){#collaboration .partner h3,#achievements .highlight h3,#international-impact .detail-block h3{font-size:21px!important;line-height:1.34!important;font-weight:650!important;color:var(--ink)!important}}'
          assert old2 in s
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused change and remove one-off workflow
        run: |
          rm .github/workflows/fix-about-item-title-color.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/app-core.css .github/workflows/fix-about-item-title-color.yml
          git commit -m 'style: unify About item title presentation'
          git push
