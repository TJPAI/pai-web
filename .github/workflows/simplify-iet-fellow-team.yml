name: Simplify IET Fellow wording
on:
  push:
    branches: [content/simplify-iet-fellow-team]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/simplify-iet-fellow-team
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('team.html')
          text = p.read_text(encoding='utf-8')
          old = '英国工程与技术学会会士（IET Fellow）'
          new = 'IET Fellow'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/validate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add team.html
          git commit -m "Simplify IET Fellow wording on team page"
          git push
