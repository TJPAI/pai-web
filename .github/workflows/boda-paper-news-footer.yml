name: Boda paper news and footer patch
on:
  push:
    branches: [release/boda-paper-news-footer-20261030]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and extract updated served files
        run: |
          python tools/package_boda.py --output /tmp/boda-all.zip
          python - <<'PY'
          import zipfile, hashlib
          files=['publications.html','en/publications.html','assets/js/site.js']
          with zipfile.ZipFile('/tmp/boda-all.zip') as src, zipfile.ZipFile('pai-web-boda-paper-news-footer-2026-10-30.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for name in files:
              out.writestr(name,src.read(name))
          with zipfile.ZipFile('pai-web-boda-paper-news-footer-2026-10-30.zip') as z:
            assert set(z.namelist())==set(files) and z.testzip() is None
            assert b'10.1109/TWC.2025.3625223' in z.read('publications.html')
            assert '© 2026'.encode('utf-8') in z.read('en/publications.html')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda-paper-news-footer-2026-10-30
          path: pai-web-boda-paper-news-footer-2026-10-30.zip
