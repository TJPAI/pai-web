name: Orbit rotation migration
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply orbit patch
        run: python tools/fix_orbit_rotation.py
      - name: Validate
        run: |
          node --check assets/js/site.js
          python tools/validate.py
          python tools/validate_share_metadata.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix: restore orbit drag rotation on iPhone"
          git push
