name: Adjust research identity alignment
on:
  push:
    branches: [fix/research-identity-equal-height]
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-identity-equal-height
      - name: Align research identity row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/refine.css')
          s=p.read_text()
          old='''/* Phone research labels share a visible top edge despite their different type sizes. */\n@media(max-width:768px){\n  .research-identity{align-items:start}\n  .research-identity>.research-index,\n  .research-identity>.research-code-main>span,\n  .research-identity>.research-code-main>.research-expansion{\n    align-self:start;margin-top:0;padding-top:0;\n    text-box-trim:trim-start;\n    text-box-edge:cap alphabetic;\n  }\n'''
          new='''/* Research identity is one visual row: index, acronym and two-line expansion share a common vertical center. */\n@media(max-width:768px){\n  .research-identity{align-items:center}\n  .research-identity>.research-index,\n  .research-identity>.research-code-main>span,\n  .research-identity>.research-code-main>.research-expansion{\n    align-self:center;margin-top:0;padding-top:0;\n  }\n'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('''    column-gap:9px;\n    align-items:start;\n    margin-bottom:20px;''','''    column-gap:9px;\n    align-items:center;\n    margin-bottom:20px;''',1)
          s=s.replace('''    display:block;\n    margin:3px 0 0;\n    color:#929BA8;''','''    display:block;\n    margin:0;\n    color:#929BA8;''',1)
          s=s.replace('''  .page-home .research-grid .research-identity>.research-code-main>.research-expansion{\n    margin-top:1px;\n    font-weight:500;''','''  .page-home .research-grid .research-identity>.research-code-main>.research-expansion{\n    margin-top:0;\n    font-weight:500;''',1)
          s=s.replace('''.research-identity{\n  --research-label-size:28px;''','''.research-identity{\n  align-items:center;\n  --research-label-size:28px;''',1)
          s=s.replace('''  font-weight:var(--research-label-weight)!important;\n  color:#8B94A2!important;\n}\n.research-identity>.research-code-main>.research-expansion{''','''  font-weight:var(--research-label-weight)!important;\n  color:#8B94A2!important;\n  align-self:center;\n  margin-top:0!important;\n}\n.research-identity>.research-code-main>span{align-self:center;margin-top:0!important}\n.research-identity>.research-code-main>.research-expansion{\n  align-self:center;\n  margin-top:0!important;''',1)
          p.write_text(s)
          PY
          python tools/validate_repository_hygiene.py
          python tools/validate.py
          python tools/validate_accessibility.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/css/refine.css
          git commit -m "Align research identity elements to one visual row"
          git push
