name: Homepage visuals update
on:
  push:
    paths:
      - '.github/workflows/home-visuals-update.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python tools/apply_home_visuals.py
      - name: Validate
        run: |
          python tools/sync_shared_head.py --check
          python tools/validate.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html assets/css/refine.css
          git commit -m 'style: add curated homepage research imagery'
          git push
      - name: Cleanup
        run: |
          git rm .github/workflows/home-visuals-update.yml tools/apply_home_visuals.py
          git commit -m 'chore: remove one-shot homepage visuals updater'
          git push
