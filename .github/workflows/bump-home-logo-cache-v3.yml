name: Force homepage logo cache refresh

on:
  push:
    paths:
      - '.github/workflows/bump-home-logo-cache-v3.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump cache keys and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'en/index.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('home-logo.css?v=20260920-02', 'home-logo.css?v=20260920-03')
              s = s.replace('home-logo.js?v=20260920-02', 'home-logo.js?v=20260920-03')
              p.write_text(s)
          PY
          rm .github/workflows/bump-home-logo-cache-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html .github/workflows/bump-home-logo-cache-v3.yml
          git commit -m 'fix: refresh homepage logo motion cache keys'
          git push
