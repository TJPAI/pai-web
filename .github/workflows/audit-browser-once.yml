name: One-off whole-site browser regression audit
on:
  push:
    branches: [audit/site-browser-20261030]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Browser navigation on iPhone-sized and desktop screens
        run: node tools/verify_navigation.cjs
      - name: Mobile navigation performance regression
        run: node tools/verify_navigation_performance.cjs
