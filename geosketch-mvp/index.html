<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html.wechat-ios,html.wechat-ios body{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}</style><script>(function(){var u=navigator.userAgent;if(/MicroMessenger/i.test(u)&&/(iPhone|iPad|iPod)/i.test(u))document.documentElement.classList.add("wechat-ios")})();</script>
<meta name="theme-color" content="#f4f4f1">
<title>GeoSketch MVP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#171717}button{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-bottom:1px solid #ddd;background:#fbfbf8;flex:none}.brand{font-weight:750;font-size:16px}.sub{font-size:10px;color:#777}.actions{display:flex;gap:6px}.actions button{height:34px;border:1px solid #d8d8d2;background:#fff;border-radius:10px;padding:0 10px}.actions .dark{background:#171717;color:#fff;border-color:#171717}.stage{position:relative;flex:1;min-height:0;padding:8px}.card{position:absolute;inset:8px;border:1px solid #d7d7d2;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.04)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.hint,.status{position:absolute;z-index:4;top:10px;font-size:10px;background:rgba(255,255,255,.9);padding:6px 9px;border-radius:999px;pointer-events:none}.hint{left:10px;color:#777}.status{right:10px;color:#555}.candidate{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;background:rgba(250,250,247,.96);backdrop-filter:blur(10px);border:1px solid #deded9;border-radius:14px;padding:8px;display:none;gap:6px;overflow:auto}.candidate.show{display:flex}.candidate button{white-space:nowrap;border:1px solid #ddd;border-radius:10px;background:#fff;padding:8px 10px;font-size:11px}.candidate button.primary{background:#171717;color:#fff;border-color:#171717}.rules{position:absolute;left:10px;right:10px;top:48px;z-index:5;display:none;gap:6px;overflow:auto}.rules.show{display:flex}.rules button{white-space:nowrap;border:1px solid #ddd;border-radius:999px;background:rgba(255,255,255,.92);padding:7px 10px;font-size:10px}.toolbar{height:72px;flex:none;padding:6px 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#fbfbf8;border-top:1px solid #ddd}.toolbar button{border:0;border-radius:12px;background:transparent;font-size:10px}.toolbar button.active{background:#171717;color:#fff}.ico{font-size:19px;display:block;line-height:20px;margin-bottom:2px}.sheet{position:fixed;left:8px;right:8px;bottom:82px;z-index:15;background:#fbfbf8;border:1px solid #ddd;border-radius:16px;padding:10px;box-shadow:0 10px 32px rgba(0,0,0,.12);display:none}.sheet.show{display:block}.sheet-title{font-size:12px;font-weight:700;margin-bottom:8px}.join-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.join-grid button{min-height:50px;border:1px solid #ddd;border-radius:12px;background:white;font-size:11px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;background:#171717;color:white;padding:8px 12px;border-radius:999px;font-size:11px;opacity:0;transition:.15s;pointer-events:none}.toast.show{opacity:1}.badge{font-size:9px;color:#888;margin-left:4px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">GeoSketch</div><div class="sub">MVP · Draw → Infer → Regularize</div></div><div class="actions"><button id="undo">撤销</button><button id="clear">清空</button><button class="dark" id="export">SVG</button></div></header>
<main class="stage"><div class="card" id="card"><canvas id="c"></canvas><div class="hint">单指手绘；抬手后选择识别结果</div><div class="status" id="status">READY</div><div class="rules" id="rules"></div><div class="candidate" id="candidate"></div></div></main>
<nav class="toolbar">
<button class="active" data-mode="draw"><span class="ico">✎</span>手绘</button>
<button data-mode="line"><span class="ico">／</span>直线</button>
<button data-mode="circle"><span class="ico">○</span>圆</button>
<button data-mode="rect"><span class="ico">□</span>矩形</button>
<button id="join"><span class="ico">⌁</span>连接</button>
</nav>
</div>
<div class="sheet" id="joinSheet"><div class="sheet-title">连接比较 <span class="badge">点画布选择两个端点</span></div><div class="join-grid"><button data-join="straight">直连<br>G0</button><button data-join="arc">圆弧<br>G1</button><button data-join="bezier">Bézier<br>G1</button><button data-join="smooth">Smooth<br>G2近似</button><button data-join="spline">Spline<br>柔和</button><button id="closeJoin">关闭</button></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('c'),card=document.getElementById('card'),ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'),candidate=document.getElementById('candidate'),rules=document.getElementById('rules'),toast=document.getElementById('toast'),joinSheet=document.getElementById('joinSheet');
let dpr=1,w=0,h=0,drawing=false,activeId=null,mode='draw',current=[],items=[],history=[],pending=null,joinPick=[],joining=false;
const clone=v=>JSON.parse(JSON.stringify(v));
function save(){history.push(clone(items));if(history.length>40)history.shift()}
function resize(){const r=card.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);render()}
function p(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function length(ps){let s=0;for(let i=1;i<ps.length;i++)s+=d(ps[i-1],ps[i]);return s}
function box(ps){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const q of ps){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)}return{x:x0,y:y0,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2}}
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1000)}
function poly(ps,color='#171717',width=3){if(ps.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.stroke()}
function drawItem(s){ctx.save();ctx.strokeStyle=s.color||'#171717';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';if(s.type==='free'||s.type==='polyline')poly(s.points,s.color||'#171717',3);else if(s.type==='line'){ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke()}else if(s.type==='circle'){ctx.beginPath();ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);ctx.stroke()}else if(s.type==='ellipse'){ctx.beginPath();ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,Math.PI*2);ctx.stroke()}else if(s.type==='rect'){ctx.strokeRect(s.x,s.y,s.w,s.h)}else if(s.type==='square'){ctx.strokeRect(s.x,s.y,s.s,s.s)}else if(s.type==='triangle'){ctx.beginPath();ctx.moveTo(s.p[0].x,s.p[0].y);ctx.lineTo(s.p[1].x,s.p[1].y);ctx.lineTo(s.p[2].x,s.p[2].y);ctx.closePath();ctx.stroke()}else if(s.type==='join'){drawJoin(s)}ctx.restore()}
function drawJoin(s){ctx.strokeStyle='#315e7d';ctx.lineWidth=3;const {a,b,kind}=s;if(kind==='straight'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();return}const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;let k=Math.min(70,L*.28);if(kind==='arc'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2+nx*k,(a.y+b.y)/2+ny*k,b.x,b.y);ctx.stroke()}else if(kind==='bezier'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+dx*.32+nx*k*.55,a.y+dy*.32+ny*k*.55,b.x-dx*.32+nx*k*.55,b.y-dy*.32+ny*k*.55,b.x,b.y);ctx.stroke()}else if(kind==='smooth'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+dx*.28,a.y+dy*.28,b.x-dx*.28+nx*k*.65,b.y-dy*.28+ny*k*.65,b.x,b.y);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+dx*.2+nx*k,a.y+dy*.2+ny*k,b.x-dx*.2-nx*k,b.y-dy*.2-ny*k,b.x,b.y);ctx.stroke()}}
function render(){ctx.clearRect(0,0,w,h);for(const s of items)drawItem(s);if(current.length)poly(current,'#315e7d',3);for(const ep of joinPick){ctx.fillStyle='#315e7d';ctx.beginPath();ctx.arc(ep.x,ep.y,6,0,Math.PI*2);ctx.fill()}}
function lineFit(ps){const a=ps[0],b=ps[ps.length-1],L=d(a,b)||1;let e=0;for(const q of ps)e+=Math.abs((b.y-a.y)*q.x-(b.x-a.x)*q.y+b.x*a.y-b.y*a.x)/L;return e/ps.length}
function simplify(ps,tol=9){if(ps.length<3)return ps.slice();const out=[ps[0]];let last=ps[0];for(let i=1;i<ps.length-1;i++){if(d(last,ps[i])>=tol){out.push(ps[i]);last=ps[i]}}out.push(ps[ps.length-1]);if(out.length>7){const step=Math.ceil(out.length/6);return out.filter((_,i)=>i%step===0||i===out.length-1)}return out}
function candidates(ps){const b=box(ps),path=length(ps)||1,ends=d(ps[0],ps[ps.length-1]),close=ends<Math.max(18,Math.min(b.w,b.h)*.35),straight=lineFit(ps)<Math.max(3,Math.min(9,path*.015));let arr=[];if(straight)arr.push({label:'直线',score:99,item:{type:'line',a:ps[0],b:ps[ps.length-1]}});if(close){const ratio=b.w/Math.max(1,b.h);if(ratio>.82&&ratio<1.22)arr.push({label:'圆',score:95,item:{type:'circle',cx:b.cx,cy:b.cy,r:(b.w+b.h)/4}});arr.push({label:'椭圆',score:90,item:{type:'ellipse',cx:b.cx,cy:b.cy,rx:b.w/2,ry:b.h/2}});if(Math.max(b.w,b.h)>35){const sq=Math.abs(b.w-b.h)/Math.max(b.w,b.h)<.16;arr.push({label:sq?'正方形':'矩形',score:84,item:sq?{type:'square',x:b.cx-Math.max(b.w,b.h)/2,y:b.cy-Math.max(b.w,b.h)/2,s:Math.max(b.w,b.h)}:{type:'rect',x:b.x,y:b.y,w:b.w,h:b.h}})}}const simp=simplify(ps);if(!close&&simp.length>=3&&simp.length<=7)arr.push({label:'折线',score:78,item:{type:'polyline',points:simp}});if(close&&simp.length>=3&&simp.length<=5){const p3=[{x:b.cx,y:b.y},{x:b.x+b.w,y:b.y+b.h},{x:b.x,y:b.y+b.h}];arr.push({label:'三角形',score:72,item:{type:'triangle',p:p3}})}arr.push({label:'保留手绘',score:50,item:{type:'free',points:ps.slice()}});return arr.slice(0,4)}
function showCandidates(ps){const arr=candidates(ps);pending={raw:ps.slice(),arr};candidate.innerHTML='';arr.forEach((c,i)=>{const b=document.createElement('button');b.className=i===0?'primary':'';b.textContent=c.label+(i<3?' · '+c.score+'%':'');b.onclick=()=>accept(i);candidate.appendChild(b)});candidate.classList.add('show')}
function accept(i){if(!pending)return;save();items.push(clone(pending.arr[i].item));pending=null;candidate.classList.remove('show');render();updateRules();msg('已转换为'+items[items.length-1].type)}
function commit(ps){if(mode==='draw'){showCandidates(ps);return}save();const a=ps[0],b=ps[ps.length-1],bb=box(ps);if(mode==='line')items.push({type:'line',a,b});else if(mode==='circle')items.push({type:'circle',cx:bb.cx,cy:bb.cy,r:(bb.w+bb.h)/4});else if(mode==='rect')items.push({type:'rect',x:bb.x,y:bb.y,w:bb.w,h:bb.h});render();updateRules()}
function angleOf(it){if(it.type!=='line')return null;return Math.atan2(it.b.y-it.a.y,it.b.x-it.a.x)}
function lenOf(it){if(it.type==='line')return d(it.a,it.b);return null}
function updateRules(){rules.innerHTML='';if(items.length<2){rules.classList.remove('show');return}const a=items[items.length-2],b=items[items.length-1],aa=angleOf(a),ab=angleOf(b),la=lenOf(a),lb=lenOf(b);let acts=[];if(aa!=null&&ab!=null){let deg=Math.abs((aa-ab)*180/Math.PI)%180;deg=Math.min(deg,180-deg);if(deg<8)acts.push(['平行',()=>makeParallel(a,b)]);if(Math.abs(deg-90)<8)acts.push(['垂直',()=>makePerpendicular(a,b)]);acts.push(['角度吸附 45°',()=>snapLastAngle(45)])}if(la&&lb&&Math.abs(la-lb)/Math.max(la,lb)<.15)acts.push(['等长',()=>makeEqualLength(a,b)]);if(!acts.length){rules.classList.remove('show');return}acts.forEach(([label,fn])=>{const x=document.createElement('button');x.textContent=label;x.onclick=fn;rules.appendChild(x)});rules.classList.add('show')}
function makeParallel(a,b){save();const L=d(b.a,b.b),ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x);b.b={x:b.a.x+L*Math.cos(ang),y:b.a.y+L*Math.sin(ang)};render();updateRules();msg('已设为平行')}
function makePerpendicular(a,b){save();const L=d(b.a,b.b),ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x)+Math.PI/2;b.b={x:b.a.x+L*Math.cos(ang),y:b.a.y+L*Math.sin(ang)};render();updateRules();msg('已设为垂直')}
function makeEqualLength(a,b){save();const L=d(a.a,a.b),ang=Math.atan2(b.b.y-b.a.y,b.b.x-b.a.x);b.b={x:b.a.x+L*Math.cos(ang),y:b.a.y+L*Math.sin(ang)};render();updateRules();msg('已设为等长')}
function snapLastAngle(step){const b=items[items.length-1];if(!b||b.type!=='line')return msg('最后一个对象不是直线');save();const L=d(b.a,b.b),ang=Math.atan2(b.b.y-b.a.y,b.b.x-b.a.x),s=step*Math.PI/180,sn=Math.round(ang/s)*s;b.b={x:b.a.x+L*Math.cos(sn),y:b.a.y+L*Math.sin(sn)};render();updateRules();msg('已吸附到 '+step+'° 倍数')}
function endpoints(){const out=[];items.forEach((it,idx)=>{if(it.type==='line'){out.push({x:it.a.x,y:it.a.y,idx,which:'a'});out.push({x:it.b.x,y:it.b.y,idx,which:'b'})}else if(it.type==='polyline'||it.type==='free'){if(it.points.length){out.push({...it.points[0],idx,which:'start'});out.push({...it.points[it.points.length-1],idx,which:'end'})}}});return out}
function nearestEndpoint(q){let best=null,bd=Infinity;for(const ep of endpoints()){const dd=d(q,ep);if(dd<bd){bd=dd;best=ep}}return bd<28?best:null}
function pickJoinPoint(q){const ep=nearestEndpoint(q);if(!ep){msg('请点靠近线段端点');return}joinPick.push({x:ep.x,y:ep.y});if(joinPick.length>2)joinPick.shift();render();if(joinPick.length===2){joinSheet.classList.add('show');msg('已选两个端点')}}
function addJoin(kind){if(joinPick.length<2)return msg('先选择两个端点');save();items.push({type:'join',a:clone(joinPick[0]),b:clone(joinPick[1]),kind});joinPick=[];joining=false;joinSheet.classList.remove('show');render();updateRules();msg('已添加 '+kind)}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();if(joining){pickJoinPoint(p(e));return}drawing=true;activeId=e.pointerId;canvas.setPointerCapture?.(e.pointerId);current=[p(e)];statusEl.textContent='DRAWING';candidate.classList.remove('show');pending=null;render()}
function move(e){if(joining)return;if(!drawing||e.pointerId!==activeId)return;e.preventDefault();const q=p(e),last=current[current.length-1];if(!last||d(q,last)>.8){current.push(q);render()}}
function up(e){if(joining)return;if(!drawing||e.pointerId!==activeId)return;e.preventDefault();drawing=false;canvas.releasePointerCapture?.(e.pointerId);activeId=null;if(current.length>1)commit(current);current=[];statusEl.textContent='READY';render()}
function exportSVG(){let body='';for(const s of items){if(s.type==='line')body+=`<line x1="${s.a.x}" y1="${s.a.y}" x2="${s.b.x}" y2="${s.b.y}"/>`;else if(s.type==='circle')body+=`<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}"/>`;else if(s.type==='ellipse')body+=`<ellipse cx="${s.cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}"/>`;else if(s.type==='rect')body+=`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}"/>`;else if(s.type==='square')body+=`<rect x="${s.x}" y="${s.y}" width="${s.s}" height="${s.s}"/>`;else if(s.type==='polyline'||s.type==='free')body+=`<polyline points="${s.points.map(p=>p.x+','+p.y).join(' ')}"/>`;else if(s.type==='triangle')body+=`<polygon points="${s.p.map(p=>p.x+','+p.y).join(' ')}"/>`}const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;const blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='geosketch.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
canvas.addEventListener('pointerdown',down,{passive:false});canvas.addEventListener('pointermove',move,{passive:false});canvas.addEventListener('pointerup',up,{passive:false});canvas.addEventListener('pointercancel',up,{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('undo').onclick=()=>{if(!history.length)return;items=history.pop();joinPick=[];pending=null;candidate.classList.remove('show');render();updateRules()};document.getElementById('clear').onclick=()=>{save();items=[];joinPick=[];render();updateRules()};document.getElementById('export').onclick=exportSVG;
document.querySelectorAll('.toolbar [data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;joining=false;joinPick=[];document.querySelectorAll('.toolbar [data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();msg('已切换 '+mode)});
document.getElementById('join').onclick=()=>{joining=true;joinPick=[];joinSheet.classList.remove('show');msg('点两个端点进行连接');render()};document.getElementById('closeJoin').onclick=()=>{joining=false;joinPick=[];joinSheet.classList.remove('show');render()};document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>addJoin(b.dataset.join));
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
})();
</script>
</body></html>
