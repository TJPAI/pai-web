name: Fix research index size once
on:
  push:
    branches: [fix/research-index-size]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-index-size
      - name: Align mobile research index size with code label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app-core.css')
          s=p.read_text()
          old=".research-identity>.research-index{grid-column:1;margin:0;padding:0;font-size:16px;line-height:1.05;letter-spacing:.08em;font-weight:500;color:#A8AFB9;white-space:nowrap}"
          new=".research-identity>.research-index{grid-column:1;margin:0;padding:0;font-size:17px;line-height:1.05;letter-spacing:.08em;font-weight:500;color:#A8AFB9;white-space:nowrap}"
          if old not in s:
              raise SystemExit('target rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/fix-research-index-size-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/app-core.css .github/workflows/fix-research-index-size-once.yml
          git commit -m 'Match research indices to code label size'
          git push
