name: Bump homepage image CSS cache
on:
  push:
    paths:
      - '.github/workflows/bump-home-image-css.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump refine CSS cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('index.html'), Path('en/index.html')]:
              s=p.read_text()
              s=s.replace('refine.css?v=20260923-02','refine.css?v=20260924-01')
              p.write_text(s)
          PY
          python tools/sync_shared_head.py --check
          python tools/validate.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html
          git commit -m 'chore: refresh homepage image css cache'
          git push
          git rm .github/workflows/bump-home-image-css.yml
          git commit -m 'chore: remove one-shot image css cache workflow'
          git push
