name: Results news full-width soft background once

on:
  push:
    branches: [refine/results-news-fullwidth-soft]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refine/results-news-fullwidth-soft
      - name: Make Latest News a full-width soft section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/refine.css')
          s = p.read_text(encoding='utf-8')
          old = '''.results-news{\n  min-width:0;\n  margin-top:34px;\n  padding:24px;\n  border-top:1px solid var(--line);\n  background:var(--soft);\n}\n'''
          new = '''.results-news{\n  position:relative;\n  z-index:0;\n  min-width:0;\n  margin-top:34px;\n  padding:24px 0;\n  border-top:0;\n  background:transparent;\n}\n.results-news::before{\n  content:\"\";\n  position:absolute;\n  z-index:-1;\n  top:0;\n  bottom:0;\n  left:50%;\n  width:100vw;\n  transform:translateX(-50%);\n  background:var(--soft);\n}\n'''
          if old not in s:
              raise SystemExit('Expected Latest News block not found')
          s = s.replace(old, new, 1)
          s = s.replace('.results-news{margin-top:28px;padding-top:20px}', '.results-news{margin-top:28px;padding:20px 0}', 1)
          s = s.replace('.results-news{margin-top:24px;padding-top:18px}', '.results-news{margin-top:24px;padding:18px 0}', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/results-news-fullwidth-soft-once.yml
      - name: Validate hygiene and diff
        run: |
          python tools/validate_repository_hygiene.py
          git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/refine.css .github/workflows/results-news-fullwidth-soft-once.yml
          git commit -m "Make latest news soft background full width"
          git push origin HEAD:refine/results-news-fullwidth-soft
