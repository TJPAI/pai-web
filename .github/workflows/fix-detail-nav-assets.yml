name: One-off detail navigation asset fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-nav-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch lightweight navigation and portrait validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site.js')
          s=p.read_text(encoding='utf-8')
          old="      currentMain.replaceWith(document.importNode(nextMain,true));\n      document.title=next.title||document.title;\n      document.body.className=next.body.className;\n      if(historyMode==='push') history.pushState({pai:true},'',url.href);\n      else if(historyMode==='replace') history.replaceState({pai:true},'',url.href);\n"
          new="      /* Move the URL before attaching fetched markup so relative assets resolve\\n         against the destination page immediately (important on iPhone Safari). */\n      if(historyMode==='push') history.pushState({pai:true},'',url.href);\n      else if(historyMode==='replace') history.replaceState({pai:true},'',url.href);\n\n      currentMain.replaceWith(document.importNode(nextMain,true));\n      document.title=next.title||document.title;\n      document.body.className=next.body.className;\n"
          if old not in s: raise SystemExit('site.js expected navigation block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('tools/validate.py')
          s=p.read_text(encoding='utf-8')
          old="# Faculty portraits are ordinary static files.\nfor name in ('erwu-liu','rui-wang','gang-shen','dunhui-xiao','shuyan-hu','yan-liu'):\n    if not (ROOT/'assets/images/people'/f'{name}.jpg').is_file(): errors.append(f'assets/images/people/{name}.jpg: missing portrait')\n"
          new="# Faculty portraits are ordinary static files. Gang Shen intentionally uses PNG.\nportrait_ext={'gang-shen':'png'}\nfor name in ('erwu-liu','rui-wang','gang-shen','dunhui-xiao','shuyan-hu','yan-liu'):\n    ext=portrait_ext.get(name,'jpg')\n    rel=f'assets/images/people/{name}.{ext}'\n    if not (ROOT/rel).is_file(): errors.append(f'{rel}: missing portrait')\n"
          if old not in s: raise SystemExit('validate.py expected portrait block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused fix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-detail-nav-assets.yml
          git add assets/js/site.js tools/validate.py
          git commit -m 'fix: resolve detail page assets after in-page navigation'
          git push origin HEAD:main
