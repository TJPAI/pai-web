name: Stabilize WeChat first paint

on:
  push:
    paths:
      - '.github/workflows/wechat-first-paint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage critical CSS loading
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              (Path('index.html'), 'assets/css/'),
              (Path('en/index.html'), '../assets/css/'),
          ]
          for path, css in targets:
              s = path.read_text()
              marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
              critical = marker + '<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>'
              if '<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>' not in s:
                  s = s.replace(marker, critical, 1)

              site = f'<link rel="stylesheet" href="{css}site.css?v=20260920-45">'
              direct = (
                  site
                  + f'<link rel="stylesheet" href="{css}refine-base.css?v=20260919-11">'
                  + f'<link rel="stylesheet" href="{css}app-core.css?v=20260920-25">'
                  + f'<link rel="stylesheet" href="{css}typography.css?v=20260919-11">'
              )
              if f'{css}refine-base.css?v=20260919-11' not in s:
                  s = s.replace(site, direct, 1)
              path.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/wechat-first-paint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize WeChat homepage first paint'
          git push
