name: Sync WeChat head to all pages

on:
  push:
    paths:
      - '.github/workflows/sync-wechat-head-all-pages.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync stable WeChat head to every HTML entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          viewport_old = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          viewport_new = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          guard = '<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html.wechat-ios,html.wechat-ios body{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}</style><script>(function(){var u=navigator.userAgent;if(/MicroMessenger/i.test(u)&&/(iPhone|iPad|iPod)/i.test(u))document.documentElement.classList.add("wechat-ios")})();</script>'

          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              original=s
              # Normalize viewport everywhere.
              s=re.sub(r'<meta name="viewport" content="width=device-width,initial-scale=1(?:,viewport-fit=cover)?">', viewport_new, s, count=1)
              # Add the first-paint guard exactly once, immediately after viewport.
              if 'document.documentElement.classList.add("wechat-ios")' not in s:
                  s=s.replace(viewport_new, viewport_new+guard, 1)
              if s != original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', *changed, sep='\n- ')
          PY
      - name: Validate
        run: python tools/validate.py
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/sync-wechat-head-all-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize iOS WeChat first paint on all pages'
          git push
