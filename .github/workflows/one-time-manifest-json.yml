name: One-time manifest JSON compatibility update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rename manifest and update references
        run: |
          python - <<'PY'
          from pathlib import Path

          old_name = 'site.webmanifest'
          new_name = 'site.json'

          old = Path(old_name)
          new = Path(new_name)
          if old.exists():
              new.write_bytes(old.read_bytes())
              old.unlink()

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/one-time-manifest-json.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_name, new_name)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated references:')
          for p in changed:
              print(' -', p)

          leftovers = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/one-time-manifest-json.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_name in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Legacy manifest references remain: ' + ', '.join(leftovers))
          if not new.exists():
              raise SystemExit('site.json was not created')
          PY

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use JSON extension for PWA manifest"
          git push
