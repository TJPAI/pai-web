name: Browser smoke regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - '*.html'
      - 'en/**'
      - 'tools/verify_current_ui.cjs'
  pull_request:
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - '*.html'
      - 'en/**'
      - 'tools/verify_current_ui.cjs'
      - '.github/workflows/browser-smoke-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run bilingual browser acceptance
        run: node tools/verify_current_ui.cjs
      - name: Run WebKit acceptance on deployment runtime
        run: |
          python3 tools/prepare_runtime.py
          PAI_BROWSER=webkit node tools/verify_current_ui.cjs
