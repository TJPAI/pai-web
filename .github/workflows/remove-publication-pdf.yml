name: One-time publication PDF cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove publication PDF fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          changed=False
          for rel in ['data/publications.json','data/publications-archive.json']:
              p=Path(rel)
              data=json.loads(p.read_text(encoding='utf-8'))
              for item in data:
                  if 'pdf' in item:
                      item.pop('pdf',None)
                      changed=True
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not changed:
              print('No PDF fields found.')
          PY
          python tools/validate.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications-archive.json
          git commit -m "content: remove legacy publication PDF links"
          git push
