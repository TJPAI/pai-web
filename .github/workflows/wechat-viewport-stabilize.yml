name: Stabilize WeChat viewport

on:
  push:
    paths:
      - '.github/workflows/wechat-viewport-stabilize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage viewport head
        shell: python
        run: |
          from pathlib import Path

          old = '<meta name="viewport" content="width=device-width,initial-scale=1"><style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>'
          new = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html.wechat-ios,html.wechat-ios body{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}</style><script>(function(){var u=navigator.userAgent;if(/MicroMessenger/i.test(u)&&/(iPhone|iPad|iPod)/i.test(u))document.documentElement.classList.add("wechat-ios")})();</script>'

          for name in ('index.html', 'en/index.html'):
              p = Path(name)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{name}: expected viewport head not found')
              p.write_text(text.replace(old, new, 1))
      - name: Validate
        run: python tools/validate.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/wechat-viewport-stabilize.yml
          git add index.html en/index.html .github/workflows/wechat-viewport-stabilize.yml
          git commit -m 'fix: stabilize iOS WeChat viewport first paint'
          git push
