name: One-off lightweight link prefetch improvement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/improve-link-prefetch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site navigation warming
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          p = Path('assets/js/site.js')
          s = p.read_text()
          if old not in s:
              raise SystemExit('target warmNavigation block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused change and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/improve-link-prefetch.yml
          git add assets/js/site.js .github/workflows/improve-link-prefetch.yml
          git commit -m 'perf: warm body links and destination images on intent'
          git push
