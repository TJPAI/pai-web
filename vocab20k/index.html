<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Vocab20K 场景化高效英语词汇训练：一个词，多场景，多义项。"><title>Vocab20K — 场景化高效背单词</title><style>:root{--bg:#f7f8fb;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--card:#fff;--accent:#4f46e5;--accent2:#eef2ff;--ok:#0f766e;--warn:#b45309;--danger:#b91c1c;--shadow:0 12px 30px rgba(17,24,39,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.mark{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px}.iconbtn,.ghost,.primary{border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.iconbtn,.ghost{background:#f3f4f6;color:var(--ink)}.primary{background:var(--ink);color:#fff}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:#fff}.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:10px;margin:2px 0;color:#374151;cursor:pointer}.navbtn.active{background:var(--accent2);color:var(--accent);font-weight:700}.side-card{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafafa}.side-card b{font-size:13px}.bar{height:8px;background:#e5e7eb;border-radius:999px;margin:10px 0 5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.main{padding:28px;max-width:1200px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.hero h2{font-size:32px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:26px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card h3{margin:0 0 14px;font-size:16px}.session{padding:26px}.scene-tag{display:inline-flex;padding:7px 10px;background:var(--accent2);color:var(--accent);border-radius:999px;font-size:12px;font-weight:700}.word-main{margin:18px 0}.word-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.word-title h2{font-size:46px;margin:0}.ipa{font-size:17px;color:var(--muted)}.speaker{border:0;background:#f3f4f6;border-radius:50%;width:38px;height:38px;cursor:pointer}.pos{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:8px}.definition{font-size:18px;line-height:1.7;margin-bottom:14px}.rootbox,.warnbox{border-radius:14px;padding:14px;margin:12px 0}.rootbox{background:#f9fafb;border:1px solid var(--line)}.warnbox{background:#fff7ed;border:1px solid #fed7aa}.sectionlabel{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.examples{display:grid;gap:8px}.example{padding:12px 14px;background:#fafafa;border-radius:12px;line-height:1.55}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.rate{border:1px solid var(--line);background:#fff;padding:12px;border-radius:12px;cursor:pointer}.rate:hover{border-color:#c7d2fe;background:#f5f7ff}.scene-list{display:grid;gap:10px}.scene-item{padding:13px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}.scene-item:hover{background:#fafafa}.scene-item b{display:block;margin-bottom:3px}.scene-item small{color:var(--muted)}.scene-count{font-weight:800}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}.select{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}.wordtable{width:100%;border-collapse:collapse}.wordtable th,.wordtable td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.wordtable th{color:var(--muted);font-size:12px}.pill{padding:5px 8px;background:#f3f4f6;border-radius:999px;font-size:11px}.clickable{cursor:pointer}.empty{padding:40px;text-align:center;color:var(--muted)}.detail-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px}.sticky{position:sticky;top:92px;height:max-content}.muted{color:var(--muted)}.review-list{display:grid;gap:10px}.review-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:13px 14px}.review-row button{border:0;background:#111827;color:#fff;border-radius:9px;padding:8px 10px}.stats-bars{display:grid;gap:13px}.statline{display:grid;grid-template-columns:140px 1fr 48px;gap:10px;align-items:center}.statline .bar{margin:0}.footer-note{margin-top:20px;color:var(--muted);font-size:12px}.kbd{border:1px solid #d1d5db;border-bottom-width:2px;border-radius:6px;padding:2px 6px;font-size:11px;background:#fff}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:18px}.metric-row{grid-template-columns:repeat(2,1fr)}.grid2,.detail-wrap{grid-template-columns:1fr}.word-title h2{font-size:38px}.actions{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 14px}.brand small{display:none}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.metric-row{grid-template-columns:1fr 1fr}.metric strong{font-size:22px}.hero h2{font-size:27px}.wordtable th:nth-child(3),.wordtable td:nth-child(3){display:none}.main{padding:14px}.session{padding:18px}.word-title h2{font-size:34px}}
.sense-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.sense-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:700;color:#4b5563}.sense-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.collocation{display:flex;gap:10px;align-items:center;background:#f5f7ff;border:1px solid #dfe3ff;padding:11px 13px;border-radius:12px;margin:10px 0 16px}.collocation span{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}.reveal{width:100%;min-height:110px;border:1px dashed #c7cbd4;background:#fafafa;border-radius:16px;color:#374151;font-weight:750;cursor:pointer;font-size:16px}.sense-progress{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sense-progress span{font-size:11px;padding:6px 8px;border-radius:8px;background:#f3f4f6;color:#4b5563}.pill-row{display:flex;gap:5px;flex-wrap:wrap}.detail-switch{margin-top:18px}.sense-panel{border-top:1px solid var(--line);padding-top:18px}.sense-kicker{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px}.mastery{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.tiny-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}.principle{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.principle:first-of-type{border-top:0;padding-top:0}.principle p{margin:6px 0 0;line-height:1.5}@media(max-width:520px){.sense-chip{padding:7px 9px}.collocation{align-items:flex-start;flex-direction:column;gap:4px}.sense-progress{display:none}}</style></head><body><div id="app"></div><script>const SCENES=[
['daily','日常生活','起居、购物、饮食、家务与日常交流',2800],['work','职场商务','会议、协作、管理、谈判与邮件',2500],['academic','学术学习','课堂、论文、研究、论证与考试',2600],['travel','旅行出行','机场、酒店、交通、问路与观光',1400],['social','社交关系','情绪、关系、观点、冲突与礼仪',1800],['tech','科技互联网','软件、AI、数据、网络与产品',2200],['health','健康医疗','症状、就医、运动、营养与身体',1500],['finance','金融消费','银行、支付、投资、保险与预算',1400],['public','公共社会','法律、政府、媒体、环境与社区',2100],['culture','文化娱乐','影视、音乐、艺术、文学与体育',1700]
];
const WORDS=[
{w:'approach',ipa:'/əˈprəʊtʃ/',scene:'work',pos:'n./v.',def:'方法；处理问题的方式；接近、靠近。作名词时常指为达到目标而采用的一套思路或方法；作动词时指接近某人/某地，或着手处理某事。',root:'来自古法语 aprochier，核心意象是“向……靠近”。可联想 proach≈near。',examples:['We need a more systematic approach to customer retention.','She approached the problem from a completely different angle.','As the deadline approached, the team increased the testing frequency.'],warn:'不要把 approach 与 method 完全等同。approach 更强调总体思路或处理方式，method 更强调具体方法或步骤。',level:'B2',freq:94},
{w:'issue',ipa:'/ˈɪʃuː/',scene:'work',pos:'n./v.',def:'问题；议题；期、号；发布、发行。作名词既可指“需要解决的问题”，也可指“讨论议题”；作动词常用于正式发布文件、声明、命令或票据。',root:'源自拉丁语 exire“出去”，后来引申为“产生出来、发布出来”。',examples:['The main issue is not cost but reliability.','The committee will discuss the issue at tomorrow’s meeting.','The agency issued a new safety guideline on Friday.'],warn:'issue 比 problem 更中性。problem 通常明确带负面意味；issue 在商务和学术语境中常只是“事项/议题”。',level:'B1',freq:99},
{w:'allocate',ipa:'/ˈæləkeɪt/',scene:'work',pos:'v.',def:'分配，划拨。指把资金、时间、人力、空间或其他有限资源按照目的分给不同对象或任务。',root:'al-（to）+ locate（放置）→“放到指定位置”→分配。',examples:['We allocated more engineers to the reliability project.','The budget allocates 30 percent of the funds to research.','Try to allocate enough time for revision before submission.'],warn:'常用结构 allocate A to B；也可说 allocate B A，但前者更自然。不要误写成 *allocate for someone* 表示“分配给某人”。',level:'C1',freq:72},
{w:'precise',ipa:'/prɪˈsaɪs/',scene:'academic',pos:'adj.',def:'精确的，准确到细节的；明确的。强调边界、数值、措辞或操作非常具体且误差很小。',root:'pre-（before）+ cis/cid（cut）→“切得分明”→界限精确。',examples:['The sensor provides precise position estimates indoors.','Please give a precise definition of the term.','The timing must be precise to avoid synchronization errors.'],warn:'precise 强调精细、具体；accurate 强调“正确、接近真值”。一个结果可以 precise 但不 accurate。',level:'B2',freq:78},
{w:'robust',ipa:'/rəʊˈbʌst/',scene:'tech',pos:'adj.',def:'强健的；稳健的；鲁棒的。指系统、方法或结论在噪声、变化、异常条件或不确定性下仍能可靠工作。',root:'源自拉丁语 robustus“橡木般强壮的”。',examples:['The algorithm remains robust under severe signal blockage.','We need a robust backup plan before deployment.','The conclusion is robust across different model specifications.'],warn:'在技术语境中 robust 通常不是“性能最高”，而是“在条件变化时仍可靠”。',level:'C1',freq:68},
{w:'derive',ipa:'/dɪˈraɪv/',scene:'academic',pos:'v.',def:'推导；得到；起源于。既可指通过逻辑或数学步骤得到结果，也可指某物从某个来源演变而来。',root:'de-（from）+ riv（river）→“从水流引出”→由某来源得到。',examples:['We derive a closed-form expression for the error bound.','Many English words derive from Latin.','The company derives most of its revenue from subscriptions.'],warn:'derive A from B = 从B得到A；be derived from = 源自。不要把方向写反。',level:'C1',freq:70},
{w:'commute',ipa:'/kəˈmjuːt/',scene:'travel',pos:'v./n.',def:'通勤，定期往返于居住地与工作地/学校之间；通勤路程。',root:'com-（together）+ mut（change）→来回变换地点。',examples:['She commutes to downtown by train every day.','My daily commute takes about forty minutes.','Many employees now commute only three days a week.'],warn:'commute 不是普通“旅行”。它特指规律性的上班或上学往返。',level:'B1',freq:61},
{w:'reservation',ipa:'/ˌrezəˈveɪʃn/',scene:'travel',pos:'n.',def:'预订；保留；保留意见。常用于酒店、餐厅、交通座位的预约，也可表示对某事“有所保留、心存疑虑”。',root:'re-（back）+ serv（keep）→“留住”→预留。',examples:['I have a reservation under the name Liu.','We made a dinner reservation for seven thirty.','I support the plan, but I still have some reservations about the timeline.'],warn:'have a reservation 可表示“有预订”，have reservations about 则是“对……有保留意见”。',level:'B2',freq:66},
{w:'symptom',ipa:'/ˈsɪmptəm/',scene:'health',pos:'n.',def:'症状；征兆。医学上指患者主观感受到或表现出来的疾病现象，也可泛指某个深层问题的外在表现。',root:'sym-（together）+ ptom（fall/occur）→随某病一起出现的现象。',examples:['A persistent cough can be a symptom of several conditions.','Tell the doctor when the symptoms first appeared.','High turnover may be a symptom of poor management.'],warn:'symptom 是“症状”，sign 在医学中更常指医生可客观观察或测量的“体征”。',level:'B2',freq:74},
{w:'diagnose',ipa:'/ˈdaɪəɡnəʊz/',scene:'health',pos:'v.',def:'诊断；判断问题原因。医学上指识别疾病；也可用于工程、管理等语境，表示判断故障或问题的根源。',root:'dia-（through）+ gno（know）→“彻底知道”→识别病因。',examples:['The doctor diagnosed him with a viral infection.','Engineers diagnosed the failure as a power-supply issue.','It is difficult to diagnose the problem without complete logs.'],warn:'常用 diagnose someone with a disease；不要说 *diagnose a patient as a disease*。',level:'B2',freq:64},
{w:'afford',ipa:'/əˈfɔːd/',scene:'finance',pos:'v.',def:'负担得起；抽得出时间；承担得起某种后果。可用于金钱，也可用于时间、资源和风险。',root:'古义与“推进、提供”有关，现代核心是“有足够资源承担”。',examples:['We cannot afford to delay the launch again.','Many families cannot afford higher housing costs.','Can you afford the time to review the full report today?'],warn:'常用 can/can’t afford + noun 或 afford to do。不要写成 *afford doing*。',level:'B1',freq:86},
{w:'interest',ipa:'/ˈɪntrəst/',scene:'finance',pos:'n./v.',def:'兴趣；利益；利息；使感兴趣。金融语境中指借款成本或存款/投资获得的利息。',root:'inter-（between）+ esse（to be）→“处于其中、有关联”→利益/兴趣。',examples:['The loan has a fixed interest rate of 4.5 percent.','She has a strong interest in formal verification.','The proposal is in the public interest.'],warn:'interest rate = 利率；interest = 利息。复数 interests 常表示“利益、权益”或“兴趣领域”。',level:'B1',freq:100},
{w:'privacy',ipa:'/ˈprɪvəsi/',scene:'tech',pos:'n.',def:'隐私；不受打扰的私人状态；个人信息被合理控制和保护的权利。',root:'private → privacy；priv- 与“个人的、非公共的”相关。',examples:['The app collects only the data needed for core functions to protect user privacy.','Privacy concerns slowed adoption of the service.','She values her privacy and rarely posts personal details online.'],warn:'privacy 是不可数名词；通常说 protect privacy，不说 *a privacy*，除非特殊法律术语。',level:'B2',freq:82},
{w:'deploy',ipa:'/dɪˈplɔɪ/',scene:'tech',pos:'v.',def:'部署；调配。指把人员、设备、软件或系统安排到实际运行位置并投入使用。',root:'de- + ploy（fold）原指“展开部队”，现代扩展到技术系统。',examples:['We deployed the new model to production last night.','The rescue team deployed sensors along the tunnel.','The company plans to deploy the service nationwide.'],warn:'在软件语境中 deploy 强调“发布到可运行环境”，不等于单纯 install。',level:'B2',freq:73},
{w:'subtle',ipa:'/ˈsʌtl/',scene:'social',pos:'adj.',def:'细微的；微妙的；不明显但重要的。常描述差异、暗示、情绪、变化或设计细节。',root:'来自拉丁语 subtilis，原义“细织的、精细的”。',examples:['There is a subtle difference between confidence and arrogance.','Her tone contained a subtle hint of frustration.','The redesign uses subtle spacing changes rather than decorative effects.'],warn:'拼写里 b 不发音。subtle 不等于 small；它强调“不易察觉但有意义”。',level:'C1',freq:70},
{w:'awkward',ipa:'/ˈɔːkwəd/',scene:'social',pos:'adj.',def:'尴尬的；别扭的；难处理的；不灵活的。既可描述社交气氛，也可描述姿势、设计或问题。',root:'awk（反向、笨拙）+ -ward（方向）→方向不顺→笨拙。',examples:['There was an awkward silence after the question.','The button is in an awkward position on smaller screens.','It is an awkward issue to raise in a first meeting.'],warn:'awkward 可表示“尴尬”，也常表示“不方便、难处理”；不要只按 embarrassed 理解。',level:'B2',freq:71},
{w:'sustainable',ipa:'/səˈsteɪnəbl/',scene:'public',pos:'adj.',def:'可持续的；能够长期维持的。可用于环境、商业模式、财政、增长速度、工作节奏等。',root:'sus-（up）+ ten/tain（hold）→“支撑住”→能够维持。',examples:['The city needs a more sustainable transport system.','This growth rate is not sustainable in the long term.','The team adopted a sustainable workload instead of relying on overtime.'],warn:'sustainable 不只等于“环保”。在商业和管理中常表示“长期可维持”。',level:'B2',freq:83},
{w:'regulate',ipa:'/ˈreɡjuleɪt/',scene:'public',pos:'v.',def:'监管；调节；控制。政府或机构可监管行业，也可指系统自动调节温度、速度或压力。',root:'reg（rule）+ -ulate →按规则控制。',examples:['The agency regulates medical devices and clinical trials.','New rules regulate how companies use personal data.','The system automatically regulates the indoor temperature.'],warn:'regulate 强调通过规则或机制控制；control 更宽泛、更直接。',level:'C1',freq:76},
{w:'plot',ipa:'/plɒt/',scene:'culture',pos:'n./v.',def:'情节；小块土地；密谋；绘制图表。文学影视中指故事情节；技术语境中常指把数据画成图。',root:'古义与“小块地、计划”相关，后发展出“情节/密谋/绘图”等义。',examples:['The film has a simple plot but strong characters.','We plotted the error against the signal-to-noise ratio.','Police discovered a plot to steal confidential data.'],warn:'plot 在数据分析中是“绘图”；在影视文学中是“情节”。语境决定含义。',level:'B2',freq:84},
{w:'interpret',ipa:'/ɪnˈtɜːprɪt/',scene:'academic',pos:'v.',def:'解释；理解；诠释；口译。强调赋予数据、文本、行为或艺术作品某种意义。',root:'inter-（between）+ pret（explain）→在两者之间解释。',examples:['The results should be interpreted with caution.','Different readers may interpret the passage differently.','She interpreted for the visiting delegation during the meeting.'],warn:'interpret data = 解读数据；translate 通常指书面/语言转换，interpret 在语言服务中通常指口译。',level:'B2',freq:88},
{w:'assume',ipa:'/əˈsjuːm/',scene:'academic',pos:'v.',def:'假设；认为；承担。学术中常表示在缺乏完全证据时先设定某条件；也可表示承担角色或责任。',root:'as-（to）+ sume（take）→“拿过来”→采取、假定。',examples:['We assume that the channel remains constant within each frame.','Do not assume that silence means agreement.','She assumed responsibility for the project after the director left.'],warn:'assume 比 suppose 更常用于正式推理。assume responsibility = 承担责任，不是“假设责任”。',level:'B2',freq:96},
{w:'retrieve',ipa:'/rɪˈtriːv/',scene:'tech',pos:'v.',def:'取回；检索；恢复。可指从数据库取数据、从存储设备恢复文件，或把某物找回来。',root:'re-（back）+ trieve（find）→找回来。',examples:['The system retrieves the most relevant documents before generating an answer.','I managed to retrieve the deleted file from the backup.','The dog quickly retrieved the ball from the water.'],warn:'retrieve information = 检索/取回信息；search 强调“寻找过程”，retrieve 强调“找到并取回结果”。',level:'B2',freq:67},

{w:'negotiate',ipa:'/nɪˈɡəʊʃieɪt/',scene:'work',pos:'v.',def:'谈判；协商；通过协商达成条件。也可表示“成功通过难走的路段或障碍”。',root:'neg-（not）+ otium（leisure）→“不是闲暇”→做生意、谈判。',examples:['The two sides negotiated a new licensing agreement.','We are negotiating with the supplier over price and delivery.','The driver carefully negotiated the narrow turn.'],warn:'negotiate with someone over/about something；若直接说 negotiate a deal，表示“谈成/协商某项协议”。',level:'B2',freq:79},

EXTRA.forEach((w,i)=>WORDS.push({w,ipa:'',scene:SCENES[(i+1)%SCENES.length][0],pos:'',def:'此词已进入 20K 词库结构；正式内容包中应补充完整核心义项、典型搭配和语境解释。',root:'待内容审校：词根、前后缀或词源说明。',examples:['Representative example sentence 1.','Representative example sentence 2.','Representative example sentence 3.'],warn:'待内容审校：常见搭配、近义词差异或易错语法。',level:['B1','B2','C1'][i%3],freq:60-i%20,stub:true}));

const state=JSON.parse(localStorage.getItem('v20k-state-v2')||'{"view":"home","learned":37,"streak":6,"review":[],"wrong":[],"ratings":{},"senseRatings":{}}');
let currentIndex=0, selectedScene='all', query='', selectedSenseScene=null, reveal=true;
function save(){localStorage.setItem('v20k-state-v2',JSON.stringify(state))}
function sceneName(id){return (SCENES.find(s=>s[0]===id)||['','综合'])[1]}
function sensesFor(w){return SENSES[w.w]||[{scene:w.scene,meaning:w.def,collocation:'',examples:w.examples,warn:w.warn}]}
function sceneIdsFor(w){return [...new Set(sensesFor(w).map(x=>x.scene))]}
function primarySense(w, preferred){const ss=sensesFor(w);return ss.find(x=>x.scene===preferred)||ss[0]}
function nextWord(){const candidates=WORDS.filter(w=>!w.stub);currentIndex=(currentIndex+1)%candidates.length;selectedSenseScene=null;reveal=false;return candidates[currentIndex]}
function currentWord(){const c=WORDS.filter(w=>!w.stub);return c[currentIndex%c.length]}
function speak(w){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}}
function rate(q){const w=currentWord();const s=primarySense(w,selectedSenseScene);const key=`${w.w}::${s.scene}`;state.senseRatings[key]=q;state.ratings[w.w]=Math.max(state.ratings[w.w]||0,q);state.learned=Math.max(state.learned,Object.keys(state.ratings).length+37);if(q<=1&&!state.wrong.includes(w.w))state.wrong.push(w.w);if(q<=2&&!state.review.includes(w.w))state.review.push(w.w);save();nextWord();render()}
function nav(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function sceneChips(w,active,clickFn){return sceneIdsFor(w).map(id=>`<button class="sense-chip ${active===id?'active':''}" onclick="${clickFn}('${id}')">${sceneName(id)}</button>`).join('')}
function shell(content){return `<div class="shell"><header class="topbar"><div class="brand"><div class="mark">20K</div><div><h1>Vocab20K</h1><small>一个词 · 多场景 · 多义项</small></div></div><div class="top-actions"><button class="ghost" onclick="nav('library')">词库</button><button class="primary" onclick="nav('learn')">开始学习</button></div></header><div class="layout"><aside class="sidebar">${[['home','今日学习'],['learn','沉浸学习'],['library','场景词库'],['review','复习队列'],['wrong','易错词'],['stats','学习统计']].map(([k,t])=>`<button class="navbtn ${state.view===k?'active':''}" onclick="nav('${k}')">${t}</button>`).join('')}<div class="side-card"><b>20,000 headwords</b><div class="bar"><i style="width:${Math.min(100,state.learned/200)}%"></i></div><small class="muted">${state.learned.toLocaleString()} / 20,000</small><div class="tiny-note">学习状态按“单词 × 场景义项”分别记录</div></div></aside><main class="main">${content}</main></div></div>`}
function home(){const due=Math.max(12,state.review.length);return shell(`<div class="hero"><div><h2>不是背 20,000 张卡片，而是掌握真实用法</h2><p>一个词可进入多个场景；系统分别记录你对每个场景义项的掌握度。</p></div><button class="primary" onclick="nav('learn')">开始今日学习</button></div><div class="metric-row"><div class="metric"><span>连续学习</span><strong>${state.streak} 天</strong></div><div class="metric"><span>已接触词</span><strong>${state.learned}</strong></div><div class="metric"><span>义项掌握记录</span><strong>${Object.keys(state.senseRatings||{}).length}</strong></div><div class="metric"><span>目标词库</span><strong>20,000</strong></div></div><div class="grid2"><div class="card"><h3>场景覆盖</h3><div class="scene-list">${SCENES.slice(0,6).map(s=>`<div class="scene-item" onclick="selectedScene='${s[0]}';nav('library')"><div><b>${s[1]}</b><small>${s[2]}</small></div><div class="scene-count">${s[3].toLocaleString()}</div></div>`).join('')}</div></div><div class="card"><h3>这版最重要的变化</h3><div class="principle"><b>issue ≠ 只背“问题”</b><p class="muted">职场是事项，学术是议题，出版是“期”，金融里还能作“发行”。</p></div><div class="principle"><b>按义项记录熟练度</b><p class="muted">你会“interest=兴趣”，不代表已经掌握金融里的“利息”和公共语境里的“利益”。</p></div><div class="principle"><b>场景例句跟着义项切换</b><p class="muted">例句不再固定三句，而是针对当前场景给最代表性的三句。</p></div></div></div>`)}
function setLearnScene(id){selectedSenseScene=id;reveal=true;render()}
function toggleReveal(){reveal=!reveal;render()}
function learn(){const w=currentWord();const ss=sensesFor(w);if(!selectedSenseScene)selectedSenseScene=ss[0].scene;const s=primarySense(w,selectedSenseScene);return shell(`<div class="hero"><div><h2>沉浸学习</h2><p>先回忆，再揭示；熟练度按当前场景义项单独记录。</p></div><div><span class="kbd">1</span> 忘记　<span class="kbd">4</span> 熟练</div></div><div class="card session"><div class="sense-switch">${sceneChips(w,selectedSenseScene,'setLearnScene')}</div><div class="word-main"><div class="word-title"><h2>${w.w}</h2><span class="ipa">${w.ipa}</span><button class="speaker" onclick="speak('${w.w}')">🔊</button></div><div class="pos">${w.pos} · ${w.level}</div>${reveal?`<div class="definition"><b>${sceneName(s.scene)}：</b>${s.meaning}</div>${s.collocation?`<div class="collocation"><span>高频搭配</span>${s.collocation}</div>`:''}`:`<button class="reveal" onclick="toggleReveal()">先自己想 3 秒 · 点击显示释义</button>`}</div>${reveal?`<div class="rootbox"><div class="sectionlabel">词根 / 词源</div>${w.root}</div><div><div class="sectionlabel">当前场景的 3 个代表例句</div><div class="examples">${s.examples.map((e,i)=>`<div class="example"><b>${i+1}.</b> ${e}</div>`).join('')}</div></div><div class="warnbox"><div class="sectionlabel">本场景易错提醒</div>${s.warn}</div><div class="sense-progress">${ss.map(x=>{const q=(state.senseRatings||{})[`${w.w}::${x.scene}`];return `<span>${sceneName(x.scene)} ${q?`· ${q}/4`:'· 未测'}</span>`}).join('')}</div><div class="actions"><button class="rate" onclick="rate(1)">1　忘记</button><button class="rate" onclick="rate(2)">2　模糊</button><button class="rate" onclick="rate(3)">3　认识</button><button class="rate" onclick="rate(4)">4　熟练</button></div>`:''}</div>`)}
function library(){const rows=WORDS.filter(w=>(selectedScene==='all'||sceneIdsFor(w).includes(selectedScene))&&(!query||w.w.includes(query.toLowerCase())||w.def.includes(query)||sensesFor(w).some(s=>s.meaning.includes(query)))).slice(0,80);return shell(`<div class="hero"><div><h2>场景词库</h2><p>一个 headword 可以同时出现在多个场景；点进去看各场景的独立义项与例句。</p></div></div><div class="toolbar"><input class="search" placeholder="搜索单词或释义" value="${query}" oninput="query=this.value;render()"><select class="select" onchange="selectedScene=this.value;render()"><option value="all">全部场景</option>${SCENES.map(s=>`<option value="${s[0]}" ${selectedScene===s[0]?'selected':''}>${s[1]} · ${s[3]}词</option>`).join('')}</select></div><div class="card"><table class="wordtable"><thead><tr><th>单词</th><th>覆盖场景</th><th>核心释义</th><th>等级</th></tr></thead><tbody>${rows.map(w=>`<tr class="clickable" onclick="showDetail('${w.w}')"><td><b>${w.w}</b><div class="muted">${w.ipa||'—'}</div></td><td><div class="pill-row">${sceneIdsFor(w).slice(0,4).map(id=>`<span class="pill">${sceneName(id)}</span>`).join('')}</div></td><td>${w.def.slice(0,66)}${w.def.length>66?'…':''}${w.stub?' <span class="muted">[待审校]</span>':''}</td><td>${w.level}</td></tr>`).join('')}</tbody></table></div><div class="footer-note">当前在线体验版重点展示“多场景义项”与学习闭环。正式 20K 内容库会继续按同一结构扩展并审校。</div>`)}
function showDetail(word){currentIndex=Math.max(0,WORDS.filter(w=>!w.stub).findIndex(w=>w.w===word));state.view='detail';state.detail=word;selectedSenseScene=null;save();render()}
function setDetailScene(id){selectedSenseScene=id;render()}
function detail(){const w=WORDS.find(x=>x.w===state.detail)||WORDS[0];const ss=sensesFor(w);if(!selectedSenseScene)selectedSenseScene=ss[0].scene;const s=primarySense(w,selectedSenseScene);return shell(`<div class="hero"><div><button class="ghost" onclick="nav('library')">← 返回词库</button><h2 style="margin-top:14px">${w.w}</h2><p>${w.level} · ${ss.length} 个已整理场景义项</p></div><button class="speaker" onclick="speak('${w.w}')">🔊</button></div><div class="detail-wrap"><div class="card"><div class="pos">${w.pos||'词性待审校'}</div><div class="ipa">${w.ipa||'IPA 待审校'}</div><div class="sense-switch detail-switch">${sceneChips(w,selectedSenseScene,'setDetailScene')}</div><div class="sense-panel"><div class="sense-kicker">${sceneName(s.scene)}中的核心用法</div><div class="definition">${s.meaning}</div>${s.collocation?`<div class="collocation"><span>高频搭配</span>${s.collocation}</div>`:''}<div class="sectionlabel">3 个代表例句</div><div class="examples">${s.examples.map((x,i)=>`<div class="example"><b>${i+1}.</b> ${x}</div>`).join('')}</div><div class="warnbox"><div class="sectionlabel">易错提醒</div>${s.warn}</div></div><div class="rootbox"><div class="sectionlabel">跨场景词根 / 词源</div>${w.root}</div></div><div class="card sticky"><h3>场景掌握度</h3>${ss.map(x=>{const q=(state.senseRatings||{})[`${w.w}::${x.scene}`];return `<div class="mastery"><span>${sceneName(x.scene)}</span><b>${q?`${q}/4`:'未测'}</b></div>`}).join('')}<button class="primary" style="width:100%;margin-top:14px" onclick="nav('learn')">从这个词开始学习</button><p class="muted">掌握一个词，不等于掌握它在所有场景中的含义。</p></div></div>`)}
function review(kind='review'){const arr=(kind==='wrong'?state.wrong:state.review);const list=arr.map(x=>WORDS.find(w=>w.w===x)).filter(Boolean);return shell(`<div class="hero"><div><h2>${kind==='wrong'?'易错词':'复习队列'}</h2><p>${kind==='wrong'?'优先处理真正容易混淆的词。':'按遗忘风险重新进入学习。'}</p></div></div><div class="card">${list.length?`<div class="review-list">${list.map(w=>`<div class="review-row"><div><b>${w.w}</b><div class="muted">${sceneIdsFor(w).map(sceneName).join(' · ')}</div></div><button onclick="showDetail('${w.w}')">复习</button></div>`).join('')}</div>`:`<div class="empty">目前没有${kind==='wrong'?'易错词':'待复习词'}。完成几轮学习后，这里会自动积累。</div>`}</div>`)}
function stats(){const rated=Object.values(state.senseRatings||{});return shell(`<div class="hero"><div><h2>学习统计</h2><p>同时看 headword 和场景义项，避免“认识一个中文释义就算会了”。</p></div></div><div class="metric-row"><div class="metric"><span>已接触词数</span><strong>${state.learned}</strong></div><div class="metric"><span>已测义项</span><strong>${rated.length}</strong></div><div class="metric"><span>熟练义项</span><strong>${rated.filter(x=>x>=4).length}</strong></div><div class="metric"><span>易错词</span><strong>${state.wrong.length}</strong></div></div><div class="card"><h3>20K 词库的场景容量规划</h3><div class="stats-bars">${SCENES.map(s=>`<div class="statline"><span>${s[1]}</span><div class="bar"><i style="width:${Math.round(s[3]/2800*100)}%"></i></div><b>${s[3]}</b></div>`).join('')}</div></div>`)}
function render(){let c;switch(state.view){case'learn':c=learn();break;case'library':c=library();break;case'review':c=review('review');break;case'wrong':c=review('wrong');break;case'stats':c=stats();break;case'detail':c=detail();break;default:c=home()}document.getElementById('app').innerHTML=c}
window.addEventListener('keydown',e=>{if(state.view==='learn'&&['1','2','3','4'].includes(e.key)&&reveal)rate(+e.key);if(state.view==='learn'&&e.code==='Space'){e.preventDefault();toggleReveal()}});render();
</script></body></html>
