name: Package Boda site

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert legacy references are gone
        run: |
          python - <<'PY'
          from pathlib import Path
          old_ext = '.' + 'webp'
          old_mail = '23666042' + '@tongji.edu.cn'
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_ext in text or old_mail in text:
                  bad.append(str(path))
          if bad:
              raise SystemExit('Legacy references remain: ' + ', '.join(bad))
          print('Legacy WebP references and old contact email: none found.')
          PY

      - name: Build deployment CSS bundle
        run: python tools/prepare_css_bundle.py

      - name: Stamp deployed asset cache keys
        run: python tools/normalize_asset_versions.py

      - name: Stage public website
        run: python tools/prepare_public_artifact.py

      - name: Remove GitHub Pages-only CNAME
        run: rm -f _site/CNAME

      - name: Package website
        run: |
          cd _site
          zip -qr ../pai-web-boda.zip .

      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: pai-web-boda
          path: pai-web-boda.zip
          if-no-files-found: error
          retention-days: 30
