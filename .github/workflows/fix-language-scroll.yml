name: One-off language switch scroll preservation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-language-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch language-switch scroll preservation
        run: |
          python -c "from pathlib import Path; p=Path('assets/js/site.js'); t=p.read_text(encoding='utf-8'); old=\"const applyPage=async(url,{historyMode='push'}={})=>{\"; new=\"const applyPage=async(url,{historyMode='push',preserveScrollY=null}={})=>{\"; assert old in t, 'applyPage signature not found'; t=t.replace(old,new,1); old=\"      if(url.hash){\\n        requestAnimationFrame(()=>document.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView());\\n      }else{\\n        scrollTo(0,0);\\n      }\\n\"; new=\"      if(Number.isFinite(preserveScrollY)){\\n        requestAnimationFrame(()=>{\\n          const maxY=Math.max(0,document.documentElement.scrollHeight-innerHeight);\\n          scrollTo(0,Math.min(preserveScrollY,maxY));\\n        });\\n      }else if(url.hash){\\n        requestAnimationFrame(()=>document.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView());\\n      }else{\\n        scrollTo(0,0);\\n      }\\n\"; assert old in t, 'scroll behavior block not found'; t=t.replace(old,new,1); old=\"    event.preventDefault();\\n    applyPage(url).catch(()=>{ location.href=url.href; });\\n\"; new=\"    event.preventDefault();\\n    const label=(link.textContent||'').trim();\\n    const isLanguageSwitch=label==='EN'||label==='中文';\\n    const options=isLanguageSwitch?{preserveScrollY:window.scrollY}:undefined;\\n    applyPage(url,options).catch(()=>{ location.href=url.href; });\\n\"; assert old in t, 'navigation click block not found'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit focused fix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-language-scroll.yml
          git add assets/js/site.js
          git commit -m 'fix: preserve reading position across language switch'
          git push origin HEAD:main
