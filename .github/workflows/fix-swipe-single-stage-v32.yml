name: Fix swipe single stage v32
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_swipe_single_stage_v32.py'
      - '.github/workflows/fix-swipe-single-stage-v32.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python tools/fix_swipe_single_stage_v32.py
      - name: Validate
        run: |
          python tools/validate.py
          node --check assets/js/site.js
      - name: Commit and self-clean
        run: |
          rm -f tools/fix_swipe_single_stage_v32.py .github/workflows/fix-swipe-single-stage-v32.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep both swipe pages in one compositing stage'
          git push
