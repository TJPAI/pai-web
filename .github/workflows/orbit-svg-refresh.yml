name: One-time orbit SVG refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild compact radial menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('assets/js/site.js')
          text=js.read_text(encoding='utf-8')
          replacement=r'''  /* Orbit quick menu — compact radial navigation with SVG text on true arcs. */
          const initOrbitMenu=()=>{
            if(document.querySelector('.pai-orbit')) return;
            const orbit=document.createElement('div');
            orbit.className='pai-orbit';
            orbit.innerHTML='<div class="pai-orbit-backdrop" aria-hidden="true"></div><div class="pai-orbit-wheel" role="navigation"></div><button class="pai-orbit-toggle" type="button" aria-expanded="false" aria-label="打开快捷菜单"><span aria-hidden="true"></span></button>';
            document.body.appendChild(orbit);
            const wheel=orbit.querySelector('.pai-orbit-wheel');
            const toggle=orbit.querySelector('.pai-orbit-toggle');
            const backdrop=orbit.querySelector('.pai-orbit-backdrop');
            let rotation=0,startAngle=0,startRotation=0,dragging=false,moved=false;

            const menuData=()=>normalizedPath().startsWith('/en/')?[
              ['Home','/en/'],['About','/en/about.html'],['People','/en/team.html'],['Research','/en/research.html'],
              ['Publications','/en/publications.html'],['Join','/en/join.html'],['Contact','/en/contact.html'],['中文',counterpartWithContext(normalizedPath())]
            ]:[
              ['首页','/'],['关于','/about.html'],['团队','/team.html'],['研究','/research.html'],
              ['成果','/publications.html'],['加入','/join.html'],['联系','/contact.html'],['EN',counterpartWithContext(normalizedPath())]
            ];

            const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
            const arcPath=(angle,index)=>{
              const r=82,half=16;
              let a1=angle-half,a2=angle+half,sweep=1;
              const norm=((angle%360)+360)%360;
              if(norm>90&&norm<270){const t=a1;a1=a2;a2=t;sweep=0;}
              const p1=polar(110,110,r,a1),p2=polar(110,110,r,a2);
              return `M ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} A ${r} ${r} 0 0 ${sweep} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
            };
            const sync=()=>{
              const en=normalizedPath().startsWith('/en/');
              const data=menuData();
              const defs=data.map((_,i)=>`<path id="orbit-arc-${i}" d="${arcPath(i*45,i)}"/>`).join('');
              const labels=data.map(([label,href],i)=>`<a href="${root(href)}" class="pai-orbit-link"><text><textPath href="#orbit-arc-${i}" startOffset="50%">${label}</textPath></text></a>`).join('');
              wheel.innerHTML=`<svg class="pai-orbit-svg" viewBox="0 0 220 220" aria-label="${en?'Quick navigation':'快捷导航'}"><defs>${defs}</defs><g class="pai-orbit-labels">${labels}</g></svg>`;
              toggle.setAttribute('aria-label',orbit.classList.contains('open')?(en?'Close quick menu':'关闭快捷菜单'):(en?'Open quick menu':'打开快捷菜单'));
            };
            const setOpen=open=>{orbit.classList.toggle('open',open);toggle.setAttribute('aria-expanded',open?'true':'false');sync();paint();};
            const pointAngle=e=>{const r=wheel.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const p=e.touches?e.touches[0]:e;return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI;};
            const paint=()=>{wheel.style.setProperty('--orbit-rotation',rotation+'deg');};
            toggle.addEventListener('click',e=>{e.preventDefault();setOpen(!orbit.classList.contains('open'));});
            backdrop.addEventListener('click',()=>setOpen(false));
            wheel.addEventListener('pointerdown',e=>{if(!orbit.classList.contains('open')) return;dragging=true;moved=false;startAngle=pointAngle(e);startRotation=rotation;wheel.setPointerCapture?.(e.pointerId);});
            wheel.addEventListener('pointermove',e=>{if(!dragging) return;const delta=pointAngle(e)-startAngle;if(Math.abs(delta)>3)moved=true;rotation=startRotation+delta;paint();});
            wheel.addEventListener('pointerup',()=>{dragging=false;});
            wheel.addEventListener('pointercancel',()=>{dragging=false;});
            wheel.addEventListener('click',e=>{const link=e.target.closest&&e.target.closest('a');if(!link)return;if(moved){e.preventDefault();moved=false;return;}setOpen(false);},true);
            document.addEventListener('keydown',e=>{if(e.key==='Escape'&&orbit.classList.contains('open'))setOpen(false);});
            new MutationObserver(()=>{if(orbit.classList.contains('open'))sync();}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
            sync();paint();
          };
          initOrbitMenu();'''
          pattern=r"  /\* Orbit quick menu[\s\S]*?  initOrbitMenu\(\);"
          text,n=re.subn(pattern,replacement,text,count=1)
          if n!=1: raise SystemExit('orbit JS block not found exactly once')
          js.write_text(text,encoding='utf-8')

          css=Path('assets/css/app-core.css')
          c=css.read_text(encoding='utf-8')
          marker='/* PAI orbit quick menu'
          pos=c.find(marker)
          if pos<0: raise SystemExit('orbit CSS marker not found')
          c=c[:pos]+r'''/* PAI orbit quick menu — compact, lower, true curved labels */
          .pai-orbit{position:fixed;inset:0;z-index:1200;pointer-events:none;--orbit-size:min(52vw,220px);--orbit-x:50%;--orbit-y:73%}
          .pai-orbit-backdrop{position:absolute;inset:0;background:rgba(15,18,24,.08);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity .22s ease;pointer-events:none}
          .pai-orbit-wheel{position:absolute;left:var(--orbit-x);top:var(--orbit-y);width:var(--orbit-size);height:var(--orbit-size);border-radius:50%;background:rgba(255,255,255,.98);box-shadow:0 14px 42px rgba(20,24,32,.14);opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(var(--orbit-rotation,0deg));transform-origin:50% 50%;transition:opacity .16s ease,transform .34s cubic-bezier(.16,.84,.2,1);pointer-events:none;touch-action:none;will-change:transform}
          .pai-orbit-wheel:before{content:"";position:absolute;inset:32%;border:1px solid rgba(23,26,31,.06);border-radius:50%;pointer-events:none}
          .pai-orbit-svg{display:block;width:100%;height:100%;overflow:visible}
          .pai-orbit-svg defs{display:none}
          .pai-orbit-link text{fill:#171A1F;font-family:inherit;font-size:11.5px;font-weight:620;letter-spacing:.04em;text-anchor:middle;dominant-baseline:middle}
          .pai-orbit-link{cursor:pointer;-webkit-tap-highlight-color:transparent}
          .pai-orbit-toggle{position:absolute;left:var(--orbit-x);top:var(--orbit-y);width:54px;height:54px;transform:translate(-50%,-50%);border:1px solid rgba(23,26,31,.09);border-radius:50%;background:#fff;box-shadow:0 5px 16px rgba(20,24,32,.09);pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
          .pai-orbit-toggle span,.pai-orbit-toggle span:after{position:absolute;content:"";left:50%;top:50%;width:19px;height:1.4px;background:#171A1F;border-radius:2px;transform:translate(-50%,-50%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
          .pai-orbit-toggle span:after{transform:translate(-50%,-50%) rotate(90deg)}
          .pai-orbit.open{pointer-events:auto}
          .pai-orbit.open .pai-orbit-backdrop{opacity:1;pointer-events:auto}
          .pai-orbit.open .pai-orbit-wheel{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--orbit-rotation,0deg));pointer-events:auto}
          .pai-orbit.open .pai-orbit-toggle span{transform:translate(-50%,-50%) rotate(45deg)}
          .pai-orbit.open .pai-orbit-toggle span:after{transform:translate(-50%,-50%) rotate(90deg)}
          @media(max-width:390px){.pai-orbit{--orbit-size:min(54vw,210px);--orbit-y:74%}.pai-orbit-link text{font-size:11px}}
          @media(min-width:769px){.pai-orbit{--orbit-size:240px;--orbit-y:70%}.pai-orbit-toggle{width:58px;height:58px}}
          @media(prefers-reduced-motion:reduce){.pai-orbit *{transition:none!important}}
          '''
          css.write_text(c,encoding='utf-8')

          ref=Path('assets/css/refine.css')
          s=ref.read_text(encoding='utf-8').replace('./app-core.css?v=20260920-15','./app-core.css?v=20260920-16')
          ref.write_text(s,encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'assets/css/refine\.css\?v=[^\"]+','assets/css/refine.css?v=20260920-16',s)
              s=re.sub(r'assets/js/site\.js\?v=[^\"]+','assets/js/site.js?v=20260920-52',s)
              p.write_text(s,encoding='utf-8')
          PY
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use compact SVG arc menu labels'
          git rm .github/workflows/orbit-svg-refresh.yml
          git commit -m 'chore: remove one-time orbit svg workflow'
          git push
