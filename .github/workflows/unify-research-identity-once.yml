name: Unify research identity once
on:
  push:
    branches: [fix/research-identity-unified]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared research identity typography
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/css/app-core.css')
          s=p.read_text()
          marker='/* Canonical research identity/title: homepage and Research page share one mobile definition. */'
          i=s.index(marker)
          j=s.index('/* About page links */', i)
          new='''/* Canonical research identity: homepage and Research page share one definition. */\n.research-identity{display:grid;grid-template-columns:max-content max-content minmax(0,1fr);column-gap:12px;align-items:start;justify-content:start;width:100%;max-width:100%;padding:0;line-height:1;text-align:left}\n.research-identity>.research-index{grid-column:1;margin:0;padding:0;font-size:18px;line-height:1.05;letter-spacing:.08em;font-weight:700;color:#A8AFB9;white-space:nowrap}\n.research-identity>.research-code-main{display:contents}\n.research-identity>.research-code-main>span{grid-column:2;margin:0;padding:0;font-size:18px;line-height:1.05;letter-spacing:.09em;font-weight:700;color:var(--ink);white-space:nowrap}\n.research-identity>.research-code-main>.research-expansion{grid-column:3;width:auto;max-width:180px;margin:0;padding:0;font-size:8.5px;line-height:1.05;letter-spacing:.055em;font-style:normal;font-weight:500;text-transform:uppercase;color:var(--muted);white-space:normal;text-align:left}\n.research .research-identity{margin-bottom:34px}\n.research-direction .research-identity{margin-bottom:22px}\n@media(max-width:768px){\n  .research-identity>.research-index,.research-identity>.research-code-main>span{font-size:17px}\n  .research-identity>.research-code-main>.research-expansion{font-size:8px;line-height:1.05}\n  .research .research-identity{margin-bottom:22px}\n  .research .research-title,.research-direction .research-title{width:auto;max-width:13em;margin:0 0 20px;padding:0}\n}\n\n'''
          p.write_text(s[:i]+new+s[j:])
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/unify-research-identity-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/css/app-core.css .github/workflows/unify-research-identity-once.yml
          git commit -m "Unify research identity typography"
          git push
