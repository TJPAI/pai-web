name: Fix share image v4 binary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild correct share image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          paths = [
              'tools/sharechunks/0b.txt', 'tools/sharechunks/0c.txt',
              'tools/sharechunks/1.txt', 'tools/sharechunks/2b.txt',
              'tools/sharechunks/3.txt', 'tools/sharechunks/4.txt'
          ]
          text = ''.join(Path(p).read_text(encoding='utf-8') for p in paths)
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          clean = ''.join(ch for ch in text if ch in alphabet)
          assert len(clean) == 46172, (len(text), len(clean))
          data = base64.b64decode(clean)
          assert len(data) == 34628, len(data)
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
          Path('assets/images/social/pai-share-v4.jpg').write_bytes(data)
          PY
          file assets/images/social/pai-share-v4.jpg | grep -q 'JPEG image data'
      - name: Validate site
        run: |
          python tools/validate.py
          python tools/validate_share_metadata.py
          node --check assets/js/site.js
      - name: Commit corrected image
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/images/social/pai-share-v4.jpg
          git diff --cached --quiet || git commit -m "fix: replace PAI share image v4 with correct artwork"
          git push
