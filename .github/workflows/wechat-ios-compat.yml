name: Mobile WebView compatibility patch

on:
  push:
    paths:
      - '.github/workflows/wechat-ios-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile WebView compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/css/refine.css')
          c = css.read_text()
          marker = '/* Mobile WebView text autosizing guard — keeps the approved two-line hero title stable. */'
          block = '''

/* Mobile WebView text autosizing guard — keeps the approved two-line hero title stable. */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
@media(max-width:768px){
  .home-hero .title-display{
    white-space:nowrap!important;
  }
}
'''
          if marker not in c:
              css.write_text(c.rstrip()+block+'\n')

          for p in Path('.').rglob('*.html'):
              t = p.read_text()
              t2 = re.sub(r'assets/css/refine\.css\?v=[^\"\']+', 'assets/css/refine.css?v=20260921-02', t)
              if t2 != t:
                  p.write_text(t2)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/wechat-ios-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize mobile WebView hero typography'
          git push
